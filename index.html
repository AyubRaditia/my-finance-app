<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Personal Finance Tracker</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0fdf4',
              100: '#dcfce7',
              500: '#22c55e',
              600: '#16a34a',
              700: '#15803d',
              900: '#14532d',
            },
            bank: {
              cardDark: '#121826',
              cardLight: '#ffffff',
              accent: '#3b82f6',
            }
          }
        }
      }
    }
  </script>
  
  <!-- Lucide Icons & React CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://unpkg.com/tesseract.js@v4.0.1/dist/tesseract.min.js"></script>

  <style>
    /* Custom Scrollbar & Sticky Layout Rules */
    body {
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    .pulse-animation {
      animation: pulse-ring 1.5s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
    }
    @keyframes pulse-ring {
      0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7); }
      70% { transform: scale(1.05); box-shadow: 0 0 0 15px rgba(34, 197, 94, 0); }
      100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
    }
  </style>
</head>
<body class="bg-gray-100 dark:bg-gray-950 text-gray-900 dark:text-gray-100 antialiased selection:bg-brand-500 selection:text-white">
  
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;

    // Helper: Format Rupiah
    const formatIDR = (val) => {
      if (val === null || val === undefined || isNaN(val)) return '0';
      return new Intl.NumberFormat('id-ID').format(val);
    };

    // Helper: Terbilang Bahasa Indonesia
    const terbilang = (angka) => {
      const bil = ["", "Satu", "Dua", "Tiga", "Empat", "Lima", "Enam", "Tujuh", "Delapan", "Sembilan", "Sepuluh", "Sebelas"];
      let num = Math.abs(parseInt(angka, 10));
      if (isNaN(num) || num === 0) return "";
      
      let res = "";
      if (num < 12) res = bil[num];
      else if (num < 20) res = terbilang(num - 10) + " Belas";
      else if (num < 100) res = terbilang(Math.floor(num / 10)) + " Puluh " + terbilang(num % 10);
      else if (num < 200) res = "Seratus " + terbilang(num - 100);
      else if (num < 1000) res = terbilang(Math.floor(num / 100)) + " Ratus " + terbilang(num % 100);
      else if (num < 2000) res = "Seribu " + terbilang(num - 1000);
      else if (num < 1000000) res = terbilang(Math.floor(num / 1000)) + " Ribu " + terbilang(num % 1000);
      else if (num < 1000000000) res = terbilang(Math.floor(num / 1000000)) + " Juta " + terbilang(num % 1000000);
      else if (num < 1000000000000) res = terbilang(Math.floor(num / 1000000000)) + " Miliar " + terbilang(num % 1000000000);
      return res.trim();
    };

    // Default Categories & Accounts
    const DEFAULT_ACCOUNTS = [
      { id: 'acc-1', name: 'BCA Utama', type: 'Bank', balance: 0, icon: 'landmark', color: 'bg-blue-600' },
      { id: 'acc-2', name: 'Dompet Cash', type: 'Cash', balance: 0, icon: 'wallet', color: 'bg-emerald-600' },
      { id: 'acc-3', name: 'Bibit Reksa Dana', type: 'Investasi', balance: 0, icon: 'trending-up', color: 'bg-purple-600' }
    ];

    const CATEGORIES = {
      Pengeluaran: ['Makanan', 'Transportasi', 'Belanja', 'Tagihan & Utilitas', 'Hiburan', 'Kesehatan', 'Pendidikan', 'Lainnya'],
      Pemasukan: ['Gaji', 'Bonus', 'Investasi', 'Hasil Usaha', 'Hadiah', 'Lainnya']
    };

    function App() {
      // LocalStorage State Initializer
      const [isDarkMode, setIsDarkMode] = useState(() => {
        return localStorage.getItem('pft_theme') === 'dark' || true;
      });
      const [hideBalance, setHideBalance] = useState(() => {
        return localStorage.getItem('pft_hide_bal') === 'true';
      });

      const [accounts, setAccounts] = useState(() => {
        const saved = localStorage.getItem('pft_accounts');
        return saved ? JSON.parse(saved) : DEFAULT_ACCOUNTS;
      });

      const [transactions, setTransactions] = useState(() => {
        const saved = localStorage.getItem('pft_transactions');
        return saved ? JSON.parse(saved) : [];
      });

      const [goals, setGoals] = useState(() => {
        const saved = localStorage.getItem('pft_goals');
        return saved ? JSON.parse(saved) : [];
      });

      // App Navigation & Modals
      const [activeTab, setActiveTab] = useState('home'); // home, history, goals, accounts, analytics
      const [isFormOpen, setIsFormOpen] = useState(false);
      const [isVoiceListening, setIsVoiceListening] = useState(false);
      const [voiceTranscript, setVoiceTranscript] = useState('');
      const [ocrProcessing, setOcrProcessing] = useState(false);

      // Form State
      const [formType, setFormType] = useState('Pengeluaran'); // Pengeluaran, Pemasukan, Transfer
      const [formAmount, setFormAmount] = useState('');
      const [formCategory, setFormCategory] = useState('Makanan');
      const [formAccountId, setFormAccountId] = useState(accounts[0]?.id || '');
      const [formToAccountId, setFormToAccountId] = useState(accounts[1]?.id || '');
      const [formNote, setFormNote] = useState('');
      const [formDate, setFormDate] = useState(new Date().toISOString().split('T')[0]);

      // Account Modal State
      const [isAccModalOpen, setIsAccModalOpen] = useState(false);
      const [accName, setAccName] = useState('');
      const [accType, setAccType] = useState('Bank');
      const [accBalance, setAccBalance] = useState('');

      // Goal Modal State
      const [isGoalModalOpen, setIsGoalModalOpen] = useState(false);
      const [goalTitle, setGoalTitle] = useState('');
      const [goalTarget, setGoalTarget] = useState('');
      const [goalSaved, setGoalSaved] = useState('');

      // Deposit to Goal Modal State
      const [selectedGoal, setSelectedGoal] = useState(null);
      const [goalDepositAmount, setGoalDepositAmount] = useState('');
      const [goalDepositAccId, setGoalDepositAccId] = useState(accounts[0]?.id || '');

      // Sync to LocalStorage
      useEffect(() => {
        localStorage.setItem('pft_accounts', JSON.stringify(accounts));
      }, [accounts]);

      useEffect(() => {
        localStorage.setItem('pft_transactions', JSON.stringify(transactions));
      }, [transactions]);

      useEffect(() => {
        localStorage.setItem('pft_goals', JSON.stringify(goals));
      }, [goals]);

      useEffect(() => {
        localStorage.setItem('pft_theme', isDarkMode ? 'dark' : 'light');
        if (isDarkMode) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      }, [isDarkMode]);

      useEffect(() => {
        localStorage.setItem('pft_hide_bal', hideBalance);
      }, [hideBalance]);

      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      });

      // Calculate Net Worth
      const totalNetWorth = useMemo(() => {
        return accounts.reduce((acc, curr) => acc + Number(curr.balance || 0), 0);
      }, [accounts]);

      // Voice Parsing Logic (Smart Detection)
      const startVoiceRecognition = () => {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
          alert('Browser HP Anda belum mendukung fitur Voice Speech Recognition.');
          return;
        }

        const recognition = new SpeechRecognition();
        recognition.lang = 'id-ID';
        recognition.continuous = false;
        recognition.interimResults = false;

        setIsVoiceListening(true);
        setVoiceTranscript('Mendengarkan ucapan Anda...');

        recognition.onresult = (event) => {
          const speechResult = event.results[0][0].transcript.toLowerCase();
          setVoiceTranscript(`"${speechResult}"`);
          parseVoiceCommand(speechResult);
          setIsVoiceListening(false);
        };

        recognition.onerror = (e) => {
          console.error(e);
          setVoiceTranscript('Gagal mengenali suara. Silakan coba lagi.');
          setIsVoiceListening(false);
        };

        recognition.onend = () => {
          setIsVoiceListening(false);
        };

        recognition.start();
      };

      const parseVoiceCommand = (text) => {
        // Opening Form
        setIsFormOpen(true);

        // 1. Detect Type (Pengeluaran / Pemasukan / Transfer)
        let detectedType = 'Pengeluaran';
        if (text.includes('pemasukan') || text.includes('dapat') || text.includes('gaji') || text.includes('terima') || text.includes('masuk')) {
          detectedType = 'Pemasukan';
        } else if (text.includes('transfer') || text.includes('pindah') || text.includes('kirim')) {
          detectedType = 'Transfer';
        }
        setFormType(detectedType);

        // 2. Detect Amount (Angka, Ribu, Juta)
        let amount = 0;
        const numberMatches = text.match(/\d+/g);
        
        if (text.includes('juta')) {
          const val = text.match(/(\d+|\bse\b|\bsatu\b|\bdua\b|\btiga\b|\bempat\b|\blima\b)\s*juta/i);
          if (val) {
            let num = parseInt(val[1]);
            if (val[1] === 'se' || val[1] === 'satu') num = 1;
            amount = num * 1000000;
          }
        } else if (text.includes('ribu') || text.includes('rb')) {
          const val = text.match(/(\d+)\s*(ribu|rb)/i);
          if (val) {
            amount = parseInt(val[1]) * 1000;
          }
        }
        
        if (!amount && numberMatches) {
          amount = parseInt(numberMatches.join(''));
        }

        if (amount) {
          setFormAmount(formatIDR(amount));
        }

        // 3. Detect Account
        const foundAcc = accounts.find(acc => text.includes(acc.name.toLowerCase()) || text.includes(acc.type.toLowerCase()));
        if (foundAcc) {
          setFormAccountId(foundAcc.id);
        }

        // 4. Detect Category
        const allCats = CATEGORIES.Pengeluaran.concat(CATEGORIES.Pemasukan);
        const foundCat = allCats.find(cat => text.includes(cat.toLowerCase()));
        if (foundCat) {
          setFormCategory(foundCat);
        } else {
          if (text.includes('bensin') || text.includes('parkir') || text.includes('ojek') || text.includes('gojek') || text.includes('grab')) {
            setFormCategory('Transportasi');
          } else if (text.includes('makan') || text.includes('minum') || text.includes('kopi') || text.includes('resto') || text.includes('nasi')) {
            setFormCategory('Makanan');
          } else if (text.includes('beli') || text.includes('baju') || text.includes('sepatu') || text.includes('tokopedia') || text.includes('shopee')) {
            setFormCategory('Belanja');
          } else if (text.includes('pulsa') || text.includes('listrik') || text.includes('wifi') || text.includes('air')) {
            setFormCategory('Tagihan & Utilitas');
          }
        }

        setFormNote(text);
      };

      // OCR Parser (Foto Struk/M-Banking)
      const handleImageOCR = (e) => {
        const file = e.target.files[0];
        if (!file) return;

        setOcrProcessing(true);
        Tesseract.recognize(
          file,
          'ind+eng',
          { logger: m => console.log(m) }
        ).then(({ data: { text } }) => {
          setOcrProcessing(false);
          const lower = text.toLowerCase();
          
          // Regex Cek Nominal Tertinggi / Total
          const totalMatch = lower.match(/(total|amount|jumlah|rp\.?)\s*([\d\.,]+)/i);
          if (totalMatch) {
            const rawNum = totalMatch[2].replace(/[^\d]/g, '');
            if (rawNum) {
              setFormAmount(formatIDR(rawNum));
            }
          }
          setFormNote(`Hasil Scan Struk: ${text.slice(0, 50)}...`);
          setIsFormOpen(true);
        }).catch(err => {
          setOcrProcessing(false);
          alert('Gagal membaca gambar/struk.');
        });
      };

      // Handle Input Nominal Format
      const handleAmountChange = (e) => {
        const raw = e.target.value.replace(/[^\d]/g, '');
        if (!raw) {
          setFormAmount('');
          return;
        }
        setFormAmount(formatIDR(raw));
      };

      // Handle Submit Transaksi
      const handleSaveTransaction = (e) => {
        e.preventDefault();
        const numericAmount = parseInt(formAmount.replace(/\./g, ''), 10);
        if (isNaN(numericAmount) || numericAmount <= 0) {
          alert('Masukkan nominal angka yang valid.');
          return;
        }

        if (formType === 'Transfer') {
          if (formAccountId === formToAccountId) {
            alert('Rekening asal dan tujuan tidak boleh sama.');
            return;
          }
          
          const sourceAcc = accounts.find(a => a.id === formAccountId);
          if (sourceAcc.balance < numericAmount) {
            alert('Saldo rekening asal tidak mencukupi.');
            return;
          }

          // Update Account Balances
          setAccounts(accounts.map(acc => {
            if (acc.id === formAccountId) return { ...acc, balance: acc.balance - numericAmount };
            if (acc.id === formToAccountId) return { ...acc, balance: acc.balance + numericAmount };
            return acc;
          }));

        } else if (formType === 'Pengeluaran') {
          const sourceAcc = accounts.find(a => a.id === formAccountId);
          if (sourceAcc && sourceAcc.balance < numericAmount) {
            if (!confirm('Saldo rekening ini kurang dari nominal pengeluaran. Lanjutkan?')) {
              return;
            }
          }

          setAccounts(accounts.map(acc => {
            if (acc.id === formAccountId) return { ...acc, balance: acc.balance - numericAmount };
            return acc;
          }));

        } else if (formType === 'Pemasukan') {
          setAccounts(accounts.map(acc => {
            if (acc.id === formAccountId) return { ...acc, balance: acc.balance + numericAmount };
            return acc;
          }));
        }

        const newTx = {
          id: 'tx-' + Date.now(),
          type: formType,
          amount: numericAmount,
          category: formType === 'Transfer' ? 'Transfer' : formCategory,
          accountId: formAccountId,
          toAccountId: formType === 'Transfer' ? formToAccountId : null,
          note: formNote || (formType === 'Transfer' ? 'Transfer Antar Rekening' : formCategory),
          date: formDate
        };

        setTransactions([newTx, ...transactions]);

        // Reset Form & Close
        setFormAmount('');
        setFormNote('');
        setIsFormOpen(false);
      };

      // Handle Add Account
      const handleSaveAccount = (e) => {
        e.preventDefault();
        const bal = parseInt(accBalance.replace(/\./g, ''), 10) || 0;
        const newAcc = {
          id: 'acc-' + Date.now(),
          name: accName,
          type: accType,
          balance: bal,
          color: accType === 'Bank' ? 'bg-blue-600' : accType === 'Cash' ? 'bg-emerald-600' : 'bg-purple-600'
        };

        setAccounts([...accounts, newAcc]);
        setAccName('');
        setAccBalance('');
        setIsAccModalOpen(false);
      };

      // Handle Save Goal
      const handleSaveGoal = (e) => {
        e.preventDefault();
        const target = parseInt(goalTarget.replace(/\./g, ''), 10) || 0;
        const saved = parseInt(goalSaved.replace(/\./g, ''), 10) || 0;

        const newGoal = {
          id: 'goal-' + Date.now(),
          title: goalTitle,
          target: target,
          saved: saved
        };

        setGoals([...goals, newGoal]);
        setGoalTitle('');
        setGoalTarget('');
        setGoalSaved('');
        setIsGoalModalOpen(false);
      };

      // Setor Dana ke Goal
      const handleDepositToGoal = (e) => {
        e.preventDefault();
        const depAmount = parseInt(goalDepositAmount.replace(/\./g, ''), 10);
        if (isNaN(depAmount) || depAmount <= 0) return;

        const sourceAcc = accounts.find(a => a.id === goalDepositAccId);
        if (sourceAcc.balance < depAmount) {
          alert('Saldo rekening tidak mencukupi.');
          return;
        }

        // Potong Saldo Rekening
        setAccounts(accounts.map(acc => {
          if (acc.id === goalDepositAccId) return { ...acc, balance: acc.balance - depAmount };
          return acc;
        }));

        // Tambah ke Goal
        setGoals(goals.map(g => {
          if (g.id === selectedGoal.id) return { ...g, saved: g.saved + depAmount };
          return g;
        }));

        // Catat sebagai Pengeluaran Alokasi Tabungan
        const newTx = {
          id: 'tx-' + Date.now(),
          type: 'Pengeluaran',
          amount: depAmount,
          category: 'Investasi/Tabungan',
          accountId: goalDepositAccId,
          note: `Alokasi Tabungan Target: ${selectedGoal.title}`,
          date: new Date().toISOString().split('T')[0]
        };
        setTransactions([newTx, ...transactions]);

        setSelectedGoal(null);
        setGoalDepositAmount('');
      };

      // Export / Import JSON Backup
      const exportData = () => {
        const data = { accounts, transactions, goals };
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `backup_keuangan_${new Date().toISOString().split('T')[0]}.json`;
        a.click();
      };

      const importData = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            const parsed = JSON.parse(event.target.result);
            if (parsed.accounts && parsed.transactions) {
              setAccounts(parsed.accounts);
              setTransactions(parsed.transactions);
              if (parsed.goals) setGoals(parsed.goals);
              alert('Data berhasil dipulihkan!');
            }
          } catch (err) {
            alert('File JSON tidak valid.');
          }
        };
        reader.readAsText(file);
      };

      return (
        <div className="max-w-md mx-auto min-h-screen pb-24 relative flex flex-col bg-gray-50 dark:bg-gray-950 shadow-2xl border-x border-gray-200 dark:border-gray-800">
          
          {/* TOP NAVBAR */}
          <header className="sticky top-0 z-30 backdrop-blur-md bg-white/80 dark:bg-gray-900/80 border-b border-gray-200 dark:border-gray-800 px-4 py-3 flex items-center justify-between">
            <div className="flex items-center space-x-3">
              <div className="w-10 h-10 rounded-full bg-brand-600 text-white flex items-center justify-center font-bold text-lg shadow-md shadow-brand-500/20">
                P
              </div>
              <div>
                <h1 className="text-xs text-gray-500 dark:text-gray-400 font-medium">Selamat Datang</h1>
                <p className="text-sm font-semibold text-gray-900 dark:text-gray-100">Personal Vault</p>
              </div>
            </div>

            <div className="flex items-center space-x-2">
              <button 
                onClick={() => setIsDarkMode(!isDarkMode)}
                className="p-2 rounded-xl text-gray-600 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-gray-800 transition"
              >
                <i data-lucide={isDarkMode ? "sun" : "moon"} className="w-5 h-5"></i>
              </button>
              <label className="p-2 rounded-xl text-gray-600 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-gray-800 transition cursor-pointer">
                <i data-lucide="upload" className="w-5 h-5"></i>
                <input type="file" accept=".json" onChange={importData} className="hidden" />
              </label>
              <button 
                onClick={exportData}
                className="p-2 rounded-xl text-gray-600 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-gray-800 transition"
              >
                <i data-lucide="download" className="w-5 h-5"></i>
              </button>
            </div>
          </header>

          {/* MAIN CONTENT CONTAINER */}
          <main className="flex-1 p-4 space-y-5">

            {/* VOICE SPEECH TRANSCRIPT NOTIFICATION */}
            {voiceTranscript && (
              <div className="p-3 bg-brand-50 dark:bg-brand-950/40 border border-brand-200 dark:border-brand-800/50 rounded-2xl flex items-center justify-between">
                <div className="flex items-center space-x-2 text-brand-700 dark:text-brand-300 text-xs">
                  <i data-lucide="mic" className="w-4 h-4 animate-pulse"></i>
                  <span>{voiceTranscript}</span>
                </div>
                <button onClick={() => setVoiceTranscript('')} className="text-gray-400 hover:text-gray-600">
                  <i data-lucide="x" className="w-4 h-4"></i>
                </button>
              </div>
            )}

            {/* VIEW 1: HOME TAB */}
            {activeTab === 'home' && (
              <>
                {/* NET WORTH CARD (BANK STYLE) */}
                <div className="relative overflow-hidden rounded-3xl bg-gradient-to-br from-gray-900 via-gray-800 to-gray-900 dark:from-gray-900 dark:via-gray-950 dark:to-black text-white p-6 shadow-xl border border-gray-800">
                  <div className="absolute top-0 right-0 -mt-8 -mr-8 w-32 h-32 bg-brand-500/10 rounded-full blur-2xl"></div>
                  
                  <div className="flex items-center justify-between mb-2">
                    <span className="text-xs uppercase tracking-wider text-gray-400 font-medium">Total Kekayaan Bersih</span>
                    <button 
                      onClick={() => setHideBalance(!hideBalance)} 
                      className="text-gray-400 hover:text-white transition"
                    >
                      <i data-lucide={hideBalance ? "eye-off" : "eye"} className="w-4 h-4"></i>
                    </button>
                  </div>

                  <div className="text-3xl font-extrabold tracking-tight mb-6">
                    {hideBalance ? 'Rp ••••••••' : `Rp ${formatIDR(totalNetWorth)}`}
                  </div>

                  {/* QUICK STATS */}
                  <div className="grid grid-cols-2 gap-3 pt-4 border-t border-gray-800/80 text-xs">
                    <div>
                      <span className="text-gray-400 block mb-0.5">Total Rekening</span>
                      <span className="font-semibold text-gray-200">{accounts.length} Akun Aktif</span>
                    </div>
                    <div>
                      <span className="text-gray-400 block mb-0.5">Target Tabungan</span>
                      <span className="font-semibold text-gray-200">{goals.length} Target</span>
                    </div>
                  </div>
                </div>

                {/* ACTION SHORTCUTS (BANK APP STYLE) */}
                <div className="grid grid-cols-4 gap-3">
                  <button 
                    onClick={() => { setFormType('Pengeluaran'); setIsFormOpen(true); }}
                    className="p-3 rounded-2xl bg-white dark:bg-gray-900 border border-gray-200 dark:border-gray-800 flex flex-col items-center justify-center space-y-1 shadow-sm active:scale-95 transition"
                  >
                    <div className="w-10 h-10 rounded-xl bg-red-100 dark:bg-red-950/50 text-red-600 flex items-center justify-center">
                      <i data-lucide="arrow-up-right" className="w-5 h-5"></i>
                    </div>
                    <span className="text-[11px] font-medium text-gray-700 dark:text-gray-300">Bayar</span>
                  </button>

                  <button 
                    onClick={() => { setFormType('Pemasukan'); setIsFormOpen(true); }}

                      onChange={e => setGoalDepositAmount(formatIDR(e.target.value.replace(/[^\d]/g, '')))}
                      placeholder="0"
                      className="w-full mt-1 p-2.5 rounded-xl bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 text-xs font-bold text-gray-900 dark:text-gray-100"
                      required
                    />
                  </div>

                  <button 
                    type="submit" 
                    className="w-full py-3 bg-brand-600 hover:bg-brand-500 text-white font-bold text-sm rounded-xl shadow-lg shadow-brand-500/30 transition"
                  >
                    Konfirmasi Setoran
                  </button>
                </form>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
