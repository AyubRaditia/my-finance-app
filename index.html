<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Personal Finance Tracker</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- React & React DOM CDN -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX Compilation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Tesseract.js Real Client-side OCR -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <!-- Google Fonts Plus Jakarta Sans -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                    },
                    colors: {
                        gold: {
                            400: '#FACC15',
                            500: '#EAB308',
                            600: '#CA8A04',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        .dark ::-webkit-scrollbar-thumb {
            background: #334155;
        }
        .gold-gradient {
            background: linear-gradient(135deg, #FACC15 0%, #CA8A04 100%);
        }
        .gold-border-glow {
            box-shadow: 0 0 15px rgba(234, 179, 8, 0.2);
        }
        button, input, select {
            touch-action: manipulation;
        }
    </style>
</head>
<body class="flex justify-center items-center min-h-screen bg-slate-100 dark:bg-slate-950 transition-colors duration-300 sm:py-4">

    <!-- Container Utama App Mobile View -->
    <div id="root" class="w-full max-w-md h-[100vh] sm:h-[844px] bg-white dark:bg-slate-900 sm:rounded-[36px] shadow-2xl overflow-hidden flex flex-col border border-slate-200 dark:border-slate-800 relative"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const CATEGORIES = {
            expense: ['Makanan & Minuman', 'Transportasi', 'Belanja', 'Tagihan & Utilitas', 'Hiburan', 'Kesehatan', 'Pendidikan', 'Lainnya'],
            income: ['Gaji / Income', 'Bonus & Cashback', 'Hasil Investasi', 'Sampingan', 'Lainnya']
        };

        const ACCOUNT_TYPES = [
            { id: 'bank', name: 'Bank / Rekening', icon: 'fa-building-columns', color: 'bg-blue-600' },
            { id: 'cash', name: 'Cash / Tunai', icon: 'fa-wallet', color: 'bg-emerald-600' },
            { id: 'reksadana', name: 'Reksa Dana', icon: 'fa-chart-line', color: 'bg-amber-600' },
            { id: 'investment', name: 'Crypto / Saham', icon: 'fa-coins', color: 'bg-purple-600' },
            { id: 'ewallet', name: 'E-Wallet', icon: 'fa-mobile-screen-button', color: 'bg-indigo-600' }
        ];

        const formatIDR = (val) => {
            return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(val || 0);
        };

        function App() {
            // Theme Mode
            const [darkMode, setDarkMode] = useState(() => {
                const savedTheme = localStorage.getItem('fin_theme');
                return savedTheme ? savedTheme === 'dark' : true;
            });

            // Pure State Kosong Tanpa Dummy
            const [accounts, setAccounts] = useState(() => {
                const saved = localStorage.getItem('fin_p_accounts');
                return saved ? JSON.parse(saved) : [];
            });

            const [transactions, setTransactions] = useState(() => {
                const saved = localStorage.getItem('fin_p_transactions');
                return saved ? JSON.parse(saved) : [];
            });

            // Navigation & Modal States
            const [activeTab, setActiveTab] = useState('dashboard'); // 'dashboard', 'transactions', 'accounts', 'analytics'
            const [isTxModalOpen, setIsTxModalOpen] = useState(false);
            const [isAccModalOpen, setIsAccModalOpen] = useState(false);
            
            // Voice & OCR States
            const [isListening, setIsListening] = useState(false);
            const [isScanning, setIsScanning] = useState(false);
            const [ocrProgress, setOcrProgress] = useState(0);
            const [voiceFeedback, setVoiceFeedback] = useState('');

            // Form Transaction State
            const [txType, setTxType] = useState('expense'); // 'expense', 'income', 'transfer'
            const [amount, setAmount] = useState('');
            const [category, setCategory] = useState(CATEGORIES.expense[0]);
            const [fromAcc, setFromAcc] = useState('');
            const [toAcc, setToAcc] = useState('');
            const [note, setNote] = useState('');
            const [searchQuery, setSearchQuery] = useState('');

            // Form Account State
            const [newAccName, setNewAccName] = useState('');
            const [newAccType, setNewAccType] = useState('bank');
            const [newAccBalance, setNewAccBalance] = useState('');

            // Theme Syncing
            useEffect(() => {
                const root = document.documentElement;
                if (darkMode) {
                    root.classList.add('dark');
                    localStorage.setItem('fin_theme', 'dark');
                } else {
                    root.classList.remove('dark');
                    localStorage.setItem('fin_theme', 'light');
                }
            }, [darkMode]);

            // Save to LocalStorage
            useEffect(() => {
                localStorage.setItem('fin_p_accounts', JSON.stringify(accounts));
            }, [accounts]);

            useEffect(() => {
                localStorage.setItem('fin_p_transactions', JSON.stringify(transactions));
            }, [transactions]);

            // Hitung Total Aset
            const totalNetWorth = accounts.reduce((acc, curr) => acc + Number(curr.balance), 0);
            const totalLiquid = accounts.filter(a => a.type === 'bank' || a.type === 'cash' || a.type === 'ewallet').reduce((acc, curr) => acc + Number(curr.balance), 0);
            const totalInvest = accounts.filter(a => a.type === 'reksadana' || a.type === 'investment').reduce((acc, curr) => acc + Number(curr.balance), 0);

            // Tambah Transaksi & Saldo Auto Sync
            const handleAddTransaction = (e) => {
                e?.preventDefault();
                const numAmount = parseFloat(amount);

                if (isNaN(numAmount) || numAmount <= 0) {
                    alert('Masukkan nominal angka yang valid!');
                    return;
                }

                if ((txType === 'expense' || txType === 'transfer') && !fromAcc) {
                    alert('Pilih akun asal!');
                    return;
                }

                if ((txType === 'income' || txType === 'transfer') && !toAcc) {
                    alert('Pilih akun tujuan!');
                    return;
                }

                const newTx = {
                    id: 'tx-' + Date.now(),
                    date: new Date().toISOString().split('T')[0],
                    type: txType,
                    amount: numAmount,
                    category: txType === 'transfer' ? 'Transfer' : category,
                    fromAccount: txType === 'income' ? null : fromAcc,
                    toAccount: txType === 'expense' ? null : toAcc,
                    note: note || (txType === 'transfer' ? 'Transfer Antar Akun' : category)
                };

                // Update saldo akun
                const updatedAccounts = accounts.map(acc => {
                    let balance = Number(acc.balance);
                    if (txType === 'expense' && acc.id === fromAcc) balance -= numAmount;
                    if (txType === 'income' && acc.id === toAcc) balance += numAmount;
                    if (txType === 'transfer') {
                        if (acc.id === fromAcc) balance -= numAmount;
                        if (acc.id === toAcc) balance += numAmount;
                    }
                    return { ...acc, balance };
                });

                setAccounts(updatedAccounts);
                setTransactions([newTx, ...transactions]);
                setAmount('');
                setNote('');
                setIsTxModalOpen(false);
            };

            // Tambah Akun Baru
            const handleAddAccount = (e) => {
                e.preventDefault();
                if (!newAccName.trim()) return;

                const selectedTypeObj = ACCOUNT_TYPES.find(t => t.id === newAccType);
                const newAccount = {
                    id: 'acc-' + Date.now(),
                    name: newAccName,
                    type: newAccType,
                    balance: parseFloat(newAccBalance) || 0,
                    icon: selectedTypeObj?.icon || 'fa-wallet',
                    color: selectedTypeObj?.color || 'bg-slate-600'
                };

                setAccounts([...accounts, newAccount]);
                setNewAccName('');
                setNewAccBalance('');
                setIsAccModalOpen(false);
            };

            // Hapus Transaksi & Kembalikan Saldo
            const handleDeleteTransaction = (id) => {
                const tx = transactions.find(t => t.id === id);
                if (!tx) return;

                const updatedAccounts = accounts.map(acc => {
                    let balance = Number(acc.balance);
                    if (tx.type === 'expense' && acc.id === tx.fromAccount) balance += tx.amount;
                    if (tx.type === 'income' && acc.id === tx.toAccount) balance -= tx.amount;
                    if (tx.type === 'transfer') {
                        if (acc.id === tx.fromAccount) balance += tx.amount;
                        if (acc.id === tx.toAccount) balance -= tx.amount;
                    }
                    return { ...acc, balance };
                });

                setAccounts(updatedAccounts);
                setTransactions(transactions.filter(t => t.id !== id));
            };

            // Real Client-Side OCR Struk (Tesseract.js)
            const handleImageScanReal = (e) => {
                const file = e.target.files[0];
                if (!file) return;

                setIsScanning(true);
                setOcrProgress(0);

                Tesseract.recognize(
                    file,
                    'ind+eng',
                    {
                        logger: m => {
                            if (m.status === 'recognizing text') {
                                setOcrProgress(Math.round(m.progress * 100));
                            }
                        }
                    }
                ).then(({ data: { text } }) => {
                    setIsScanning(false);
                    
                    // Parse Angka Terbesar / Total dari Hasil Teks
                    const cleanText = text.toLowerCase();
                    const numberMatches = text.match(/\b\d{1,3}(?:[.,]\d{3})*(?:[.,]\d{2})?\b/g);
                    
                    let detectedAmount = 0;
                    if (numberMatches) {
                        const parsedNumbers = numberMatches.map(n => parseInt(n.replace(/[^0-9]/g, ''), 10)).filter(n => n > 100 && n < 100000000);
                        if (parsedNumbers.length > 0) {
                            detectedAmount = Math.max(...parsedNumbers);
                        }
                    }

                    setTxType('expense');
                    setAmount(detectedAmount ? detectedAmount.toString() : '');
                    setNote(cleanText.slice(0, 30) || 'Scan Struk OCR');
                    setIsTxModalOpen(true);
                }).catch(err => {
                    setIsScanning(false);
                    alert('Gagal membaca gambar struk. Coba foto yang lebih jelas.');
                });
            };

            // Input Suara (Web Speech API)
            const handleVoiceInput = () => {
                if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
                    alert('Browser anda tidak mendukung fitur pengenalan suara.');
                    return;
                }

                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                const recognition = new SpeechRecognition();
                recognition.lang = 'id-ID';
                recognition.continuous = false;

                setIsListening(true);
                setVoiceFeedback('Mendengarkan... (Contoh: Beli makan 25000)');

                recognition.onresult = (event) => {
                    const text = event.results[0][0].transcript.toLowerCase();
                    setVoiceFeedback(`Terdengar: "${text}"`);
                    
                    // Extract Angka
                    const numbers = text.match(/\d+/g);
                    if (numbers) {
                        setAmount(numbers.join(''));
                    }

                    if (text.includes('dapat') || text.includes('gaji') || text.includes('pemasukan')) {
                        setTxType('income');
                    } else if (text.includes('transfer') || text.includes('pindah')) {
                        setTxType('transfer');
                    } else {
                        setTxType('expense');
                    }

                    // Matching Akun Asal
                    accounts.forEach(acc => {
                        if (text.includes(acc.name.toLowerCase())) {
                            setFromAcc(acc.id);
                        }
                    });

                    setNote(text);
                    setIsListening(false);
                    setIsTxModalOpen(true);
                };

                recognition.onerror = () => setIsListening(false);
                recognition.onend = () => setIsListening(false);
                recognition.start();
            };

            // Export & Import Data Backup
            const handleExportData = () => {
                const dataStr = JSON.stringify({ accounts, transactions }, null, 2);
                const blob = new Blob([dataStr], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `backup-keuangan-${new Date().toISOString().split('T')[0]}.json`;
                a.click();
            };

            const handleImportData = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        const parsed = JSON.parse(event.target.result);
                        if (Array.isArray(parsed.accounts) && Array.isArray(parsed.transactions)) {
                            setAccounts(parsed.accounts);
                            setTransactions(parsed.transactions);
                            alert('Data berhasil di-import!');
                        }
                    } catch (err) {
                        alert('Format file JSON tidak valid!');
                    }
                };
                reader.readAsText(file);
            };

            const handleResetAllData = () => {
                if (confirm('Apakah kamu yakin ingin menghapus SELURUH data akun & transaksi? Data akan kembali ke 0.')) {
                    setAccounts([]);
                    setTransactions([]);
                    localStorage.removeItem('fin_p_accounts');
                    localStorage.removeItem('fin_p_transactions');
                }
            };

            // Filter Transaksi
            const filteredTransactions = transactions.filter(t => 
                t.note.toLowerCase().includes(searchQuery.toLowerCase()) || 
                t.category.toLowerCase().includes(searchQuery.toLowerCase())
            );

            return (
                <div className="flex flex-col h-full text-slate-800 dark:text-slate-100 font-sans relative">
                    
                    {/* Top Header Mobile */}
                    <div className="px-5 pt-5 pb-3 bg-slate-50 dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 flex justify-between items-center z-10">
                        <div className="flex items-center space-x-3">
                            <div className="w-9 h-9 rounded-xl gold-gradient flex items-center justify-center font-bold text-slate-950 shadow-md">
                                <i className="fa-solid fa-wallet text-sm"></i>
                            </div>
                            <div>
                                <h1 className="text-sm font-bold tracking-tight">Finance App</h1>
                                <p className="text-[10px] text-slate-500 dark:text-slate-400 font-medium">Personal Asset Tracker</p>
                            </div>
                        </div>

                        <div className="flex items-center space-x-2">
                            {/* Toggle Theme Button */}
                            <button 
                                onClick={() => setDarkMode(!darkMode)}
                                className="w-8 h-8 rounded-lg bg-slate-200 dark:bg-slate-800 text-slate-700 dark:text-gold-400 flex items-center justify-center transition"
                                title="Toggle Mode Terang/Gelap"
                            >
                                <i className={`fa-solid ${darkMode ? 'fa-sun' : 'fa-moon'} text-xs`}></i>
                            </button>
                            
                            {/* Backup Options */}
                            <button onClick={handleExportData} className="w-8 h-8 rounded-lg bg-slate-200 dark:bg-slate-800 text-slate-600 dark:text-slate-300 flex items-center justify-center text-xs">
                                <i className="fa-solid fa-download"></i>
                            </button>
                            <label className="w-8 h-8 rounded-lg bg-slate-200 dark:bg-slate-800 text-slate-600 dark:text-slate-300 flex items-center justify-center text-xs cursor-pointer">
                                <i className="fa-solid fa-upload"></i>
                                <input type="file" accept=".json" onChange={handleImportData} className="hidden" />
                            </label>
                            <button onClick={handleResetAllData} className="w-8 h-8 rounded-lg bg-red-500/10 text-red-500 flex items-center justify-center text-xs" title="Reset Data">
                                <i className="fa-solid fa-trash"></i>
                            </button>
                        </div>
                    </div>

                    {/* App Main Body Viewport */}
                    <div className="flex-1 overflow-y-auto px-4 py-4 space-y-5 pb-24">

                        {/* TAB 1: DASHBOARD */}
                        {activeTab === 'dashboard' && (
                            <>
                                {/* Net Worth Card */}
                                <div className="gold-gradient p-5 rounded-2xl text-slate-950 shadow-xl gold-border-glow relative overflow-hidden">
                                    <div className="absolute -right-6 -bottom-6 opacity-15 text-9xl">
                                        <i className="fa-solid fa-vault"></i>
                                    </div>
                                    <p className="text-xs font-bold uppercase tracking-wider text-slate-900/80">Total Kekayaan (Net Worth)</p>
                                    <h2 className="text-2xl font-black mt-1 tracking-tight">
                                        {formatIDR(totalNetWorth)}
                                    </h2>

                                    <div className="mt-4 pt-3 border-t border-slate-950/20 grid grid-cols-2 gap-2 text-xs">
                                        <div>
                                            <p className="text-[10px] text-slate-900/70 uppercase font-semibold">Kas & Bank</p>
                                            <p className="font-bold text-slate-950">{formatIDR(totalLiquid)}</p>
                                        </div>
                                        <div>
                                            <p className="text-[10px] text-slate-900/70 uppercase font-semibold">Investasi</p>
                                            <p className="font-bold text-slate-950">{formatIDR(totalInvest)}</p>
                                        </div>
                                    </div>
                                </div>

                                {/* Smart Voice & Image Scan Action Bar */}
                                <div className="bg-slate-100 dark:bg-slate-800/60 p-2 rounded-xl border border-slate-200 dark:border-slate-800 flex items-center justify-between gap-2">
                                    <button 
                                        onClick={handleVoiceInput}
                                        className={`flex-1 flex items-center justify-center gap-2 py-2 px-3 rounded-lg border text-xs font-semibold transition ${
                                            isListening ? 'bg-red-500 text-white border-red-500 animate-pulse' : 'bg-white dark:bg-slate-800 border-slate-300 dark:border-slate-700 text-slate-700 dark:text-slate-200'
                                        }`}
                                    >
                                        <i className="fa-solid fa-microphone text-gold-500"></i>
                                        <span>{isListening ? 'Mendengarkan...' : 'Suara (Mic)'}</span>
                                    </button>

                                    <label className="flex-1 flex items-center justify-center gap-2 py-2 px-3 rounded-lg bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-700 text-slate-700 dark:text-slate-200 text-xs font-semibold cursor-pointer transition">
                                        <i className="fa-solid fa-camera text-gold-500"></i>
                                        <span>{isScanning ? `Scan (${ocrProgress}%)` : 'Scan Struk'}</span>
                                        <input type="file" accept="image/*" onChange={handleImageScanReal} className="hidden" disabled={isScanning} />
                                    </label>
                                </div>

                                {voiceFeedback && (
                                    <p className="text-[11px] text-amber-500 italic text-center">{voiceFeedback}</p>
                                )}

                                {/* Summary Accounts Section */}
                                <div>
                                    <div className="flex justify-between items-center mb-2.5">
                                        <h3 className="text-xs font-bold uppercase tracking-wider text-slate-400">Daftar Akun / Rekening</h3>
                                        <button onClick={() => setIsAccModalOpen(true)} className="text-xs font-bold text-gold-500 hover:underline">
                                            + Tambah Akun
                                        </button>
                                    </div>

                                    {accounts.length === 0 ? (
                                        <div className="bg-slate-50 dark:bg-slate-800/40 p-6 rounded-xl border border-dashed border-slate-300 dark:border-slate-800 text-center space-y-2">
                                            <i className="fa-solid fa-wallet text-2xl text-slate-400"></i>
                                            <p className="text-xs text-slate-500">Belum ada akun. Klik "+ Tambah Akun" untuk mulai dari 0.</p>
                                        </div>
                                    ) : (
                                        <div className="grid grid-cols-2 gap-2.5">
                                            {accounts.map(acc => (
                                                <div key={acc.id} className="bg-white dark:bg-slate-800/80 p-3 rounded-xl border border-slate-200 dark:border-slate-800 flex flex-col justify-between space-y-2">
                                                    <div className="flex items-center justify-between">
                                                        <span className={`w-7 h-7 rounded-lg ${acc.color} flex items-center justify-center text-white text-xs`}>
                                                            <i className={`fa-solid ${acc.icon}`}></i>
                                                        </span>
                                                        <span className="text-[9px] font-bold text-slate-400 uppercase">{acc.type}</span>
                                                    </div>
                                                    <div>
                                                        <p className="text-xs font-semibold text-slate-500 dark:text-slate-400 truncate">{acc.name}</p>
                                                        <p className="text-sm font-bold text-slate-800 dark:text-slate-100 mt-0.5">{formatIDR(acc.balance)}</p>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    )}
                                </div>

                                {/* Recent Transactions Section */}
                                <div>
                                    <div className="flex justify-between items-center mb-2.5">
                                        <h3 className="text-xs font-bold uppercase tracking-wider text-slate-400">Transaksi Terbaru</h3>
                                        <button onClick={() => setActiveTab('transactions')} className="text-xs font-semibold text-gold-500 hover:underline">
                                            Lihat Semua
                                        </button>
                                    </div>

                                    {transactions.length === 0 ? (
                                        <p className="text-xs text-slate-400 text-center py-4">Belum ada transaksi recorded.</p>
                                    ) : (
                                        <div className="space-y-2">
                                            {transactions.slice(0, 4).map(tx => (
                                                <div key={tx.id} className="bg-white dark:bg-slate-800/80 p-3 rounded-xl border border-slate-200 dark:border-slate-800 flex items-center justify-between">
                                                    <div className="flex items-center space-x-3">
                                                        <div className={`w-8 h-8 rounded-lg flex items-center justify-center text-xs font-bold ${
                                                            tx.type === 'expense' ? 'bg-red-500/10 text-red-500' :
                                                            tx.type === 'income' ? 'bg-emerald-500/10 text-emerald-500' :
                                                            'bg-blue-500/10 text-blue-500'
                                                        }`}>
                                                            <i className={`fa-solid ${
                                                                tx.type === 'expense' ? 'fa-arrow-up' : tx.type === 'income' ? 'fa-arrow-down' : 'fa-right-left'
                                                            }`}></i>
                                                        </div>
                                                        <div>
                                                            <p className="text-xs font-bold">{tx.note}</p>
                                                            <p className="text-[10px] text-slate-400">{tx.date} • {tx.category}</p>
                                                        </div>
                                                    </div>
                                                    <p className={`text-xs font-bold ${
                                                        tx.type === 'expense' ? 'text-red-500' : tx.type === 'income' ? 'text-emerald-500' : 'text-blue-500'
                                                    }`}>
                                                        {tx.type === 'expense' ? '-' : tx.type === 'income' ? '+' : ''}{formatIDR(tx.amount)}
                                                    </p>
                                                </div>
                                            ))}
                                        </div>
                                    )}
                                </div>
                            </>
                        )}

                        {/* TAB 2: RIWAYAT TRANSAKSI */}
                        {activeTab === 'transactions' && (
                            <div className="space-y-3">
                                <div className="flex justify-between items-center">
                                    <h3 className="text-sm font-bold">Semua Transaksi</h3>
                                </div>

                                <input 
                                    type="text"
                                    placeholder="Cari transaksi..."
                                    value={searchQuery}
                                    onChange={e => setSearchQuery(e.target.value)}
                                    className="w-full bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl px-3 py-2 text-xs focus:outline-none"
                                />

                                {filteredTransactions.length === 0 ? (
                                    <p className="text-xs text-slate-400 text-center py-8">Tidak ada transaksi ditemukan.</p>
                                ) : (
                                    filteredTransactions.map(tx => (
                                        <div key={tx.id} className="bg-white dark:bg-slate-800/80 p-3 rounded-xl border border-slate-200 dark:border-slate-800 flex items-center justify-between">
                                            <div className="flex items-center space-x-3">
                                                <div className={`w-8 h-8 rounded-lg flex items-center justify-center text-xs font-bold ${
                                                    tx.type === 'expense' ? 'bg-red-500/10 text-red-500' :
                                                    tx.type === 'income' ? 'bg-emerald-500/10 text-emerald-500' :
                                                    'bg-blue-500/10 text-blue-500'
                                                }`}>
                                                    <i className={`fa-solid ${
                                                        tx.type === 'expense' ? 'fa-arrow-up' : tx.type === 'income' ? 'fa-arrow-down' : 'fa-right-left'
                                                    }`}></i>
                                                </div>
                                                <div>
                                                    <p className="text-xs font-bold">{tx.note}</p>
                                                    <p className="text-[10px] text-slate-400">{tx.date} • {tx.category}</p>
                                                </div>
                                            </div>
                                            <div className="flex items-center space-x-2">
                                                <p className={`text-xs font-bold ${
                                                    tx.type === 'expense' ? 'text-red-500' : tx.type === 'income' ? 'text-emerald-500' : 'text-blue-500'
                                                }`}>
                                                    {tx.type === 'expense' ? '-' : tx.type === 'income' ? '+' : ''}{formatIDR(tx.amount)}
                                                </p>
                                                <button onClick={() => handleDeleteTransaction(tx.id)} className="text-slate-400 hover:text-red-500 text-xs p-1">
                                                    <i className="fa-solid fa-trash-can"></i>
                                                </button>
                                            </div>
                                        </div>
                                    ))
                                )}
                            </div>
                        )}

                        {/* TAB 3: AKUN & ASET */}
                        {activeTab === 'accounts' && (
                            <div className="space-y-3">
                                <div className="flex justify-between items-center mb-2">
                                    <h3 className="text-sm font-bold">Kelola Akun Keuangan</h3>
                                    <button onClick={() => setIsAccModalOpen(true)} className="text-xs font-bold bg-gold-500 text-slate-950 px-3 py-1.5 rounded-lg">
                                        + Akun
                                    </button>
                                </div>

                                {accounts.map(acc => (
                                    <div key={acc.id} className="bg-white dark:bg-slate-800/80 p-4 rounded-xl border border-slate-200 dark:border-slate-800 flex items-center justify-between">
                                        <div className="flex items-center space-x-3">
                                            <div className={`w-10 h-10 rounded-xl ${acc.color} flex items-center justify-center text-white text-base shadow-sm`}>
                                                <i className={`fa-solid ${acc.icon}`}></i>
                                            </div>
                                            <div>
                                                <h4 className="text-xs font-bold">{acc.name}</h4>
                                                <span className="text-[10px] text-slate-400 uppercase font-semibold">{acc.type}</span>
                                            </div>
                                        </div>
                                        <p className="text-xs font-bold text-gold-500">{formatIDR(acc.balance)}</p>
                                    </div>
                                ))}
                            </div>
                        )}

                        {/* TAB 4: ANALISIS */}
                        {activeTab === 'analytics' && (
                            <div className="space-y-4">
                                <h3 className="text-sm font-bold">Analisis Alokasi Aset</h3>
                                <div className="bg-white dark:bg-slate-800/80 p-4 rounded-xl border border-slate-200 dark:border-slate-800 space-y-3">
                                    {accounts.length === 0 ? (
                                        <p className="text-xs text-slate-400 text-center py-4">Belum ada data alokasi.</p>
                                    ) : (
                                        accounts.map(acc => {
                                            const pct = totalNetWorth > 0 ? Math.round((acc.balance / totalNetWorth) * 100) : 0;
                                            return (
                                                <div key={acc.id} className="space-y-1">
                                                    <div className="flex justify-between text-xs">
                                                        <span className="text-slate-500 dark:text-slate-400">{acc.name}</span>
                                                        <span className="font-bold">{pct}%</span>
                                                    </div>
                                                    <div className="w-full h-2 bg-slate-100 dark:bg-slate-700 rounded-full overflow-hidden">
                                                        <div className={`h-full ${acc.color}`} style={{ width: `${pct}%` }}></div>
                                                    </div>
                                                </div>
                                            );
                                        })
                                    )}
                                </div>
                            </div>
                        )}

                    </div>

                    {/* Floating Add Transaction Button */}
                    <div className="absolute bottom-20 right-5 z-20">
                        <button 
                            onClick={() => setIsTxModalOpen(true)}
                            className="w-13 h-13 rounded-full gold-gradient text-slate-950 font-bold flex items-center justify-center shadow-xl hover:scale-105 active:scale-95 transition"
                            style={{ width: '52px', height: '52px' }}
                        >
                            <i className="fa-solid fa-plus text-xl"></i>
                        </button>
                    </div>

                    {/* Navigation Bar Bottom Mobile */}
                    <div className="absolute bottom-0 left-0 right-0 bg-white dark:bg-slate-900 border-t border-slate-200 dark:border-slate-800 px-6 py-2.5 flex justify-between items-center z-10">
                        <button onClick={() => setActiveTab('dashboard')} className={`flex flex-col items-center space-y-1 ${activeTab === 'dashboard' ? 'text-gold-500 font-bold' : 'text-slate-400'}`}>
                            <i className="fa-solid fa-house text-base"></i>
                            <span className="text-[9px]">Home</span>
                        </button>
                        <button onClick={() => setActiveTab('transactions')} className={`flex flex-col items-center space-y-1 ${activeTab === 'transactions' ? 'text-gold-500 font-bold' : 'text-slate-400'}`}>
                            <i className="fa-solid fa-receipt text-base"></i>
                            <span className="text-[9px]">Riwayat</span>
                        </button>
                        <button onClick={() => setActiveTab('accounts')} className={`flex flex-col items-center space-y-1 ${activeTab === 'accounts' ? 'text-gold-500 font-bold' : 'text-slate-400'}`}>
                            <i className="fa-solid fa-wallet text-base"></i>
                            <span className="text-[9px]">Aset</span>
                        </button>
                        <button onClick={() => setActiveTab('analytics')} className={`flex flex-col items-center space-y-1 ${activeTab === 'analytics' ? 'text-gold-500 font-bold' : 'text-slate-400'}`}>
                            <i className="fa-solid fa-chart-pie text-base"></i>
                            <span className="text-[9px]">Analisis</span>
                        </button>
                    </div>

                    {/* MODAL TRANSAKSI */}
                    {isTxModalOpen && (
                        <div className="absolute inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center p-0 sm:p-4">
                            <div className="bg-white dark:bg-slate-900 w-full max-w-md rounded-t-2xl sm:rounded-2xl border border-slate-200 dark:border-slate-800 p-5 space-y-4">
                                <div className="flex justify-between items-center border-b border-slate-200 dark:border-slate-800 pb-3">
                                    <h3 className="text-sm font-bold">Tambah Transaksi</h3>
                                    <button onClick={() => setIsTxModalOpen(false)} className="text-slate-400">
                                        <i className="fa-solid fa-xmark text-lg"></i>
                                    </button>
                                </div>

                                <div className="grid grid-cols-3 gap-1 bg-slate-100 dark:bg-slate-800 p-1 rounded-xl">
                                    <button type="button" onClick={() => setTxType('expense')} className={`py-1 rounded-lg text-xs font-bold ${txType === 'expense' ? 'bg-red-500 text-white' : 'text-slate-400'}`}>Pengeluaran</button>
                                    <button type="button" onClick={() => setTxType('income')} className={`py-1 rounded-lg text-xs font-bold ${txType === 'income' ? 'bg-emerald-500 text-white' : 'text-slate-400'}`}>Pemasukan</button>
                                    <button type="button" onClick={() => setTxType('transfer')} className={`py-1 rounded-lg text-xs font-bold ${txType === 'transfer' ? 'bg-blue-500 text-white' : 'text-slate-400'}`}>Transfer</button>
                                </div>

                                <form onSubmit={handleAddTransaction} className="space-y-3">
                                    <div>
                                        <label className="text-[10px] font-semibold text-slate-400 block mb-1">Nominal (Rp)</label>
                                        <input type="number" placeholder="0" value={amount} onChange={e => setAmount(e.target.value)} className="w-full bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl px-3 py-2 text-sm font-bold focus:outline-none" required />
                                    </div>

                                    {txType !== 'transfer' && (
                                        <div>
                                            <label className="text-[10px] font-semibold text-slate-400 block mb-1">Kategori</label>
                                            <select value={category} onChange={e => setCategory(e.target.value)} className="w-full bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl px-3 py-2 text-xs focus:outline-none">
                                                {CATEGORIES[txType].map(c => <option key={c} value={c}>{c}</option>)}
                                            </select>
                                        </div>
                                    )}

                                    <div className="grid grid-cols-2 gap-2">
                                        {(txType === 'expense' || txType === 'transfer') && (
                                            <div>
                                                <label className="text-[10px] font-semibold text-slate-400 block mb-1">Dari Akun</label>
                                                <select value={fromAcc} onChange={e => setFromAcc(e.target.value)} className="w-full bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl px-2 py-2 text-xs focus:outline-none">
                                                    <option value="">-- Pilih --</option>
                                                    {accounts.map(a => <option key={a.id} value={a.id}>{a.name}</option>)}
                                                </select>
                                            </div>
                                        )}
                                        {(txType === 'income' || txType === 'transfer') && (
                                            <div>
                                                <label className="text-[10px] font-semibold text-slate-400 block mb-1">Ke Akun</label>
                                                <select value={toAcc} onChange={e => setToAcc(e.target.value)} className="w-full bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl px-2 py-2 text-xs focus:outline-none">
                                                    <option value="">-- Pilih --</option>
                                                    {accounts.map(a => <option key={a.id} value={a.id}>{a.name}</option>)}
                                                </select>
                                            </div>
                                        )}
                                    </div>

                                    <div>
                                        <label className="text-[10px] font-semibold text-slate-400 block mb-1">Catatan</label>
                                        <input type="text" placeholder="Keterangan..." value={note} onChange={e => setNote(e.target.value)} className="w-full bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl px-3 py-2 text-xs focus:outline-none" />
                                    </div>

                                    <button type="submit" className="w-full py-2.5 gold-gradient text-slate-950 font-bold rounded-xl text-xs mt-2">Simpan</button>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* MODAL TAMBAH AKUN */}
                    {isAccModalOpen && (
                        <div className="absolute inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div className="bg-white dark:bg-slate-900 w-full max-w-md rounded-2xl border border-slate-200 dark:border-slate-800 p-5 space-y-4">
                                <div className="flex justify-between items-center border-b border-slate-200 dark:border-slate-800 pb-3">
                                    <h3 className="text-sm font-bold">Tambah Akun / Rekening</h3>
                                    <button onClick={() => setIsAccModalOpen(false)} className="text-slate-400">
                                        <i className="fa-solid fa-xmark text-lg"></i>
                                    </button>
                                </div>

                                <form onSubmit={handleAddAccount} className="space-y-3">
                                    <div>
                                        <label className="text-[10px] font-semibold text-slate-400 block mb-1">Nama Akun (misal: BCA / Cash)</label>
                                        <input type="text" placeholder="Nama Akun..." value={newAccName} onChange={e => setNewAccName(e.target.value)} className="w-full bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl px-3 py-2 text-xs focus:outline-none" required />
                                    </div>

                                    <div>
                                        <label className="text-[10px] font-semibold text-slate-400 block mb-1">Tipe Aset</label>
                                        <select value={newAccType} onChange={e => setNewAccType(e.target.value)} className="w-full bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl px-3 py-2 text-xs focus:outline-none">
                                            {ACCOUNT_TYPES.map(t => <option key={t.id} value={t.id}>{t.name}</option>)}
                                        </select>
                                    </div>

                                    <div>
                                        <label className="text-[10px] font-semibold text-slate-400 block mb-1">Saldo Awal (Rp)</label>
                                        <input type="number" placeholder="0" value={newAccBalance} onChange={e => setNewAccBalance(e.target.value)} className="w-full bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl px-3 py-2 text-xs focus:outline-none" required />
                                    </div>

                                    <button type="submit" className="w-full py-2.5 gold-gradient text-slate-950 font-bold rounded-xl text-xs">Simpan Akun</button>
                                </form>
                            </div>
                        </div>
                    )}

                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
