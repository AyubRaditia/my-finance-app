<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Personal Finance Tracker Pro</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- React & React DOM CDN -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX Compilation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Tesseract.js Real Client-side OCR -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <!-- Google Fonts Plus Jakarta Sans -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                    },
                    colors: {
                        gold: {
                            400: '#FACC15',
                            500: '#EAB308',
                            600: '#CA8A04',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        .dark ::-webkit-scrollbar-thumb {
            background: #334155;
        }
        .gold-gradient {
            background: linear-gradient(135deg, #FACC15 0%, #CA8A04 100%);
        }
        .gold-border-glow {
            box-shadow: 0 0 15px rgba(234, 179, 8, 0.2);
        }
        button, input, select {
            touch-action: manipulation;
        }
    </style>
</head>
<body class="flex justify-center items-center min-h-screen bg-slate-100 dark:bg-slate-950 transition-colors duration-300 sm:py-4">

    <!-- Container Utama App Mobile View -->
    <div id="root" class="w-full max-w-md h-[100vh] sm:h-[844px] bg-white dark:bg-slate-900 sm:rounded-[36px] shadow-2xl overflow-hidden flex flex-col border border-slate-200 dark:border-slate-800 relative"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const CATEGORIES = {
            expense: ['Makanan & Minuman', 'Transportasi', 'Belanja & Groceries', 'Tagihan & Utilitas', 'Hiburan', 'Kesehatan', 'Pendidikan', 'Investasi / Tabungan', 'Lainnya'],
            income: ['Gaji Utama', 'Bonus & Cashback', 'Hasil Investasi', 'Usaha Sampingan', 'Lainnya']
        };

        const ACCOUNT_TYPES = [
            { id: 'bank', name: 'Bank / Rekening', icon: 'fa-building-columns', color: 'bg-blue-600' },
            { id: 'cash', name: 'Cash / Tunai', icon: 'fa-wallet', color: 'bg-emerald-600' },
            { id: 'reksadana', name: 'Reksa Dana', icon: 'fa-chart-line', color: 'bg-amber-600' },
            { id: 'investment', name: 'Crypto / Saham', icon: 'fa-coins', color: 'bg-purple-600' },
            { id: 'ewallet', name: 'E-Wallet', icon: 'fa-mobile-screen-button', color: 'bg-indigo-600' }
        ];

        // Format Angka ke IDR Standard
        const formatIDR = (val) => {
            return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(val || 0);
        };

        // Format Angka Ribuan saat Mengetik di Input (1000000 -> 1.000.000)
        const formatInputNumber = (val) => {
            if (!val) return '';
            const raw = val.toString().replace(/\D/g, '');
            return raw.replace(/\B(?=(\d{3})+(?!\d))/g, '.');
        };

        const parseRawNumber = (val) => {
            if (!val) return 0;
            return parseFloat(val.toString().replace(/\./g, '')) || 0;
        };

        // Helper Konversi Terbilang Angka Bahasa Indonesia
        const terbilangIDR = (nilai) => {
            const angka = Math.abs(parseRawNumber(nilai));
            if (!angka) return '';
            
            const satuan = ['', 'Satu', 'Dua', 'Tiga', 'Empat', 'Lima', 'Enam', 'Tujuh', 'Delapan', 'Sembilan', 'Sepuluh', 'Sebelas'];
            
            const konversi = (n) => {
                if (n < 12) return satuan[n];
                if (n < 20) return konversi(n - 10) + ' Belas';
                if (n < 100) return konversi(Math.floor(n / 10)) + ' Puluh ' + konversi(n % 10);
                if (n < 200) return 'Seratus ' + konversi(n - 100);
                if (n < 1000) return konversi(Math.floor(n / 100)) + ' Ratus ' + konversi(n % 100);
                if (n < 2000) return 'Seribu ' + konversi(n - 1000);
                if (n < 1000000) return konversi(Math.floor(n / 1000)) + ' Ribu ' + konversi(n % 1000);
                if (n < 1000000000) return konversi(Math.floor(n / 1000000)) + ' Juta ' + konversi(n % 1000000);
                if (n < 1000000000000) return konversi(Math.floor(n / 1000000000)) + ' Miliar ' + konversi(n % 1000000000);
                return '';
            };

            return konversi(angka).trim() + ' Rupiah';
        };

        function App() {
            // Theme Mode State
            const [darkMode, setDarkMode] = useState(() => {
                const savedTheme = localStorage.getItem('fin_theme');
                return savedTheme ? savedTheme === 'dark' : true;
            });

            // LocalStorage Core Data
            const [accounts, setAccounts] = useState(() => {
                const saved = localStorage.getItem('fin_p_accounts');
                return saved ? JSON.parse(saved) : [];
            });

            const [transactions, setTransactions] = useState(() => {
                const saved = localStorage.getItem('fin_p_transactions');
                return saved ? JSON.parse(saved) : [];
            });

            const [goals, setGoals] = useState(() => {
                const saved = localStorage.getItem('fin_p_goals');
                return saved ? JSON.parse(saved) : [];
            });

            // Navigation & Modal States
            const [activeTab, setActiveTab] = useState('dashboard'); // 'dashboard', 'transactions', 'accounts', 'goals', 'analytics'
            const [isTxModalOpen, setIsTxModalOpen] = useState(false);
            const [isAccModalOpen, setIsAccModalOpen] = useState(false);
            const [isGoalModalOpen, setIsGoalModalOpen] = useState(false);
            
            // Smart OCR & Voice Input States
            const [isListening, setIsListening] = useState(false);
            const [isScanning, setIsScanning] = useState(false);
            const [ocrProgress, setOcrProgress] = useState(0);
            const [voiceFeedback, setVoiceFeedback] = useState('');

            // Transaction Form State (Formatted IDR String Input)
            const [txType, setTxType] = useState('expense');
            const [formattedAmount, setFormattedAmount] = useState('');
            const [category, setCategory] = useState(CATEGORIES.expense[0]);
            const [fromAcc, setFromAcc] = useState('');
            const [toAcc, setToAcc] = useState('');
            const [note, setNote] = useState('');
            const [searchQuery, setSearchQuery] = useState('');

            // Account Form State
            const [newAccName, setNewAccName] = useState('');
            const [newAccType, setNewAccType] = useState('bank');
            const [newFormattedBalance, setNewFormattedBalance] = useState('');

            // Goal Form State
            const [newGoalTitle, setNewGoalTitle] = useState('');
            const [newGoalTargetFormatted, setNewGoalTargetFormatted] = useState('');
            const [newGoalCurrentFormatted, setNewGoalCurrentFormatted] = useState('');

            // Investment Calc State
            const [calcInitial, setCalcInitial] = useState('1.000.000');
            const [calcMonthly, setCalcMonthly] = useState('500.000');
            const [calcYield, setCalcYield] = useState('8');
            const [calcYears, setCalcYears] = useState('5');

            // Theme Effect
            useEffect(() => {
                const root = document.documentElement;
                if (darkMode) {
                    root.classList.add('dark');
                    localStorage.setItem('fin_theme', 'dark');
                } else {
                    root.classList.remove('dark');
                    localStorage.setItem('fin_theme', 'light');
                }
            }, [darkMode]);

            // Save Data Effect
            useEffect(() => {
                localStorage.setItem('fin_p_accounts', JSON.stringify(accounts));
            }, [accounts]);

            useEffect(() => {
                localStorage.setItem('fin_p_transactions', JSON.stringify(transactions));
            }, [transactions]);

            useEffect(() => {
                localStorage.setItem('fin_p_goals', JSON.stringify(goals));
            }, [goals]);

            // Asset Calculations
            const totalNetWorth = accounts.reduce((acc, curr) => acc + Number(curr.balance), 0);
            const totalLiquid = accounts.filter(a => a.type === 'bank' || a.type === 'cash' || a.type === 'ewallet').reduce((acc, curr) => acc + Number(curr.balance), 0);
            const totalInvest = accounts.filter(a => a.type === 'reksadana' || a.type === 'investment').reduce((acc, curr) => acc + Number(curr.balance), 0);

            // Handler Input Formatted Number
            const handleAmountChange = (e, setter) => {
                const formatted = formatInputNumber(e.target.value);
                setter(formatted);
            };

            // Tambah Transaksi & Auto Update Saldo Akun
            const handleAddTransaction = (e) => {
                e?.preventDefault();
                const numAmount = parseRawNumber(formattedAmount);

                if (numAmount <= 0) {
                    alert('Masukkan nominal angka transaksi yang valid!');
                    return;
                }

                if ((txType === 'expense' || txType === 'transfer') && !fromAcc) {
                    alert('Pilih akun asal!');
                    return;
                }

                if ((txType === 'income' || txType === 'transfer') && !toAcc) {
                    alert('Pilih akun tujuan!');
                    return;
                }

                if (txType === 'transfer' && fromAcc === toAcc) {
                    alert('Akun asal dan akun tujuan tidak boleh sama!');
                    return;
                }

                const newTx = {
                    id: 'tx-' + Date.now(),
                    date: new Date().toISOString().split('T')[0],
                    type: txType,
                    amount: numAmount,
                    category: txType === 'transfer' ? 'Transfer' : category,
                    fromAccount: txType === 'income' ? null : fromAcc,
                    toAccount: txType === 'expense' ? null : toAcc,
                    note: note || (txType === 'transfer' ? 'Transfer Antar Akun' : category)
                };

                // Sync Saldo Akun
                const updatedAccounts = accounts.map(acc => {
                    let balance = Number(acc.balance);
                    if (txType === 'expense' && acc.id === fromAcc) balance -= numAmount;
                    if (txType === 'income' && acc.id === toAcc) balance += numAmount;
                    if (txType === 'transfer') {
                        if (acc.id === fromAcc) balance -= numAmount;
                        if (acc.id === toAcc) balance += numAmount;
                    }
                    return { ...acc, balance };
                });

                setAccounts(updatedAccounts);
                setTransactions([newTx, ...transactions]);
                setFormattedAmount('');
                setNote('');
                setIsTxModalOpen(false);
            };

            // Tambah Akun Baru
            const handleAddAccount = (e) => {
                e.preventDefault();
                if (!newAccName.trim()) return;

                const selectedTypeObj = ACCOUNT_TYPES.find(t => t.id === newAccType);
                const newAccount = {
                    id: 'acc-' + Date.now(),
                    name: newAccName,
                    type: newAccType,
                    balance: parseRawNumber(newNewAccBalance => newAccBalance) || parseRawNumber(newFormattedBalance),
                    icon: selectedTypeObj?.icon || 'fa-wallet',
                    color: selectedTypeObj?.color || 'bg-slate-600'
                };

                setAccounts([...accounts, newAccount]);
                setNewAccName('');
                setNewFormattedBalance('');
                setIsAccModalOpen(false);
            };

            // Tambah Financial Goal
            const handleAddGoal = (e) => {
                e.preventDefault();
                if (!newGoalTitle.trim()) return;

                const targetNum = parseRawNumber(newGoalTargetFormatted);
                const currentNum = parseRawNumber(newGoalCurrentFormatted);

                if (targetNum <= 0) {
                    alert('Target nominal harus lebih dari 0!');
                    return;
                }

                const newGoal = {
                    id: 'goal-' + Date.now(),
                    title: newGoalTitle,
                    targetAmount: targetNum,
                    currentAmount: currentNum
                };

                setGoals([...goals, newGoal]);
                setNewGoalTitle('');
                setNewGoalTargetFormatted('');
                setNewGoalCurrentFormatted('');
                setIsGoalModalOpen(false);
            };

            // Hapus Transaksi & Revert Saldo
            const handleDeleteTransaction = (id) => {
                const tx = transactions.find(t => t.id === id);
                if (!tx) return;

                const updatedAccounts = accounts.map(acc => {
                    let balance = Number(acc.balance);
                    if (tx.type === 'expense' && acc.id === tx.fromAccount) balance += tx.amount;
                    if (tx.type === 'income' && acc.id === tx.toAccount) balance -= tx.amount;
                    if (tx.type === 'transfer') {
                        if (acc.id === tx.fromAccount) balance += tx.amount;
                        if (acc.id === tx.toAccount) balance -= tx.amount;
                    }
                    return { ...acc, balance };
                });

                setAccounts(updatedAccounts);
                setTransactions(transactions.filter(t => t.id !== id));
            };

            const handleDeleteGoal = (id) => {
                setGoals(goals.filter(g => g.id !== id));
            };

            // Client OCR Struk Real
            const handleImageScanReal = (e) => {
                const file = e.target.files[0];
                if (!file) return;

                setIsScanning(true);
                setOcrProgress(0);

                Tesseract.recognize(
                    file,
                    'ind+eng',
                    {
                        logger: m => {
                            if (m.status === 'recognizing text') {
                                setOcrProgress(Math.round(m.progress * 100));
                            }
                        }
                    }
                ).then(({ data: { text } }) => {
                    setIsScanning(false);
                    const cleanText = text.toLowerCase();
                    const numberMatches = text.match(/\b\d{1,3}(?:[.,]\d{3})*(?:[.,]\d{2})?\b/g);
                    
                    let detectedAmount = 0;
                    if (numberMatches) {
                        const parsedNumbers = numberMatches.map(n => parseInt(n.replace(/[^0-9]/g, ''), 10)).filter(n => n > 100 && n < 100000000);
                        if (parsedNumbers.length > 0) {
                            detectedAmount = Math.max(...parsedNumbers);
                        }
                    }

                    setTxType('expense');
                    setFormattedAmount(formatInputNumber(detectedAmount));
                    setNote(cleanText.slice(0, 30) || 'Scan Struk OCR');
                    setIsTxModalOpen(true);
                }).catch(err => {
                    setIsScanning(false);
                    alert('Gagal mengurai teks dari struk. Coba foto yang lebih terang.');
                });
            };

            // Smart Indonesian Voice Speech Parser
            const handleVoiceInput = () => {
                if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
                    alert('Browser anda belum mendukung pengenal suara.');
                    return;
                }

                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                const recognition = new SpeechRecognition();
                recognition.lang = 'id-ID';
                recognition.continuous = false;

                setIsListening(true);
                setVoiceFeedback('Mendengarkan... (Contoh: "Beli makan 50 ribu dari cash")');

                recognition.onresult = (event) => {
                    const text = event.results[0][0].transcript.toLowerCase();
                    setVoiceFeedback(`Terdengar: "${text}"`);
                    
                    let parsedNominal = 0;
                    // Detect "juta" or "ribu" words
                    if (text.includes('juta')) {
                        const match = text.match(/(\d+)\s*juta/);
                        if (match) parsedNominal = parseInt(match[1], 10) * 1000000;
                    } else if (text.includes('ribu')) {
                        const match = text.match(/(\d+)\s*ribu/);
                        if (match) parsedNominal = parseInt(match[1], 10) * 1000;
                    } else {
                        const numbers = text.match(/\d+/g);
                        if (numbers) parsedNominal = parseInt(numbers.join(''), 10);
                    }

                    if (parsedNominal > 0) {
                        setFormattedAmount(formatInputNumber(parsedNominal));
                    }

                    if (text.includes('gaji') || text.includes('dapat') || text.includes('masuk')) {
                        setTxType('income');
                    } else if (text.includes('transfer') || text.includes('pindah')) {
                        setTxType('transfer');
                    } else {
                        setTxType('expense');
                    }

                    accounts.forEach(acc => {
                        if (text.includes(acc.name.toLowerCase())) {
                            setFromAcc(acc.id);
                        }
                    });

                    setNote(text);
                    setIsListening(false);
                    setIsTxModalOpen(true);
                };

                recognition.onerror = () => setIsListening(false);
                recognition.onend = () => setIsListening(false);
                recognition.start();
            };

            // Backup & Restore Export JSON
            const handleExportData = () => {
                const dataStr = JSON.stringify({ accounts, transactions, goals }, null, 2);
                const blob = new Blob([dataStr], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `backup-keuangan-${new Date().toISOString().split('T')[0]}.json`;
                a.click();
            };

            const handleImportData = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        const parsed = JSON.parse(event.target.result);
                        if (Array.isArray(parsed.accounts) && Array.isArray(parsed.transactions)) {
                            setAccounts(parsed.accounts);
                            setTransactions(parsed.transactions);
                            if (Array.isArray(parsed.goals)) setGoals(parsed.goals);
                            alert('Data berhasil dipulihkan!');
                        }
                    } catch (err) {
                        alert('Format file JSON tidak sah!');
                    }
                };
                reader.readAsText(file);
            };

            const handleResetAllData = () => {
                if (confirm('Yakin ingin mengosongkan SELURUH data keuangan? Data tidak bisa dikembalikan.')) {
                    setAccounts([]);
                    setTransactions([]);
                    setGoals([]);
                    localStorage.removeItem('fin_p_accounts');
                    localStorage.removeItem('fin_p_transactions');
                    localStorage.removeItem('fin_p_goals');
                }
            };

            // Hitung Simulasi Return Investasi
            const calculateInvestment = () => {
                const P = parseRawNumber(calcInitial);
                const PMT = parseRawNumber(calcMonthly);
                const r = (parseFloat(calcYield) || 0) / 100 / 12;
                const n = (parseFloat(calcYears) || 0) * 12;

                let futureValue = P * Math.pow(1 + r, n);
                for (let i = 1; i <= n; i++) {
                    futureValue += PMT * Math.pow(1 + r, n - i);
                }

                const totalModal = P + (PMT * n);
                const totalProfit = Math.max(0, futureValue - totalModal);

                return {
                    futureValue: Math.round(futureValue),
                    totalModal: Math.round(totalModal),
                    totalProfit: Math.round(totalProfit)
                };
            };

            const invResult = calculateInvestment();

            // Filter Transactions
            const filteredTransactions = transactions.filter(t => 
                t.note.toLowerCase().includes(searchQuery.toLowerCase()) || 
                t.category.toLowerCase().includes(searchQuery.toLowerCase())
            );

            return (
                <div className="flex flex-col h-full text-slate-800 dark:text-slate-100 font-sans relative">
                    
                    {/* Top Header Mobile */}
                    <div className="px-5 pt-5 pb-3 bg-slate-50 dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 flex justify-between items-center z-10">
                        <div className="flex items-center space-x-3">
                            <div className="w-9 h-9 rounded-xl gold-gradient flex items-center justify-center font-bold text-slate-950 shadow-md">
                                <i className="fa-solid fa-vault text-sm"></i>
                            </div>
                            <div>
                                <h1 className="text-sm font-bold tracking-tight">Finance Pro</h1>
                                <p className="text-[10px] text-slate-500 dark:text-slate-400 font-medium">Personal Finance Manager</p>
                            </div>
                        </div>

                        <div className="flex items-center space-x-2">
                            {/* Toggle Mode Gelap / Terang */}
                            <button 
                                onClick={() => setDarkMode(!darkMode)}
                                className="w-8 h-8 rounded-lg bg-slate-200 dark:bg-slate-800 text-slate-700 dark:text-gold-400 flex items-center justify-center transition"
                                title="Mode Terang / Gelap"
                            >
                                <i className={`fa-solid ${darkMode ? 'fa-sun' : 'fa-moon'} text-xs`}></i>
                            </button>
                            
                            <button onClick={handleExportData} className="w-8 h-8 rounded-lg bg-slate-200 dark:bg-slate-800 text-slate-600 dark:text-slate-300 flex items-center justify-center text-xs" title="Backup JSON">
                                <i className="fa-solid fa-download"></i>
                            </button>
                            <label className="w-8 h-8 rounded-lg bg-slate-200 dark:bg-slate-800 text-slate-600 dark:text-slate-300 flex items-center justify-center text-xs cursor-pointer" title="Restore JSON">
                                <i className="fa-solid fa-upload"></i>
                                <input type="file" accept=".json" onChange={handleImportData} className="hidden" />
                            </label>
                            <button onClick={handleResetAllData} className="w-8 h-8 rounded-lg bg-red-500/10 text-red-500 flex items-center justify-center text-xs" title="Reset All Data">
                                <i className="fa-solid fa-trash"></i>
                            </button>
                        </div>
                    </div>

                    {/* App Main Viewport */}
                    <div className="flex-1 overflow-y-auto px-4 py-4 space-y-5 pb-24">

                        {/* TAB 1: DASHBOARD */}
                        {activeTab === 'dashboard' && (
                            <>
                                {/* Net Worth Gold Card */}
                                <div className="gold-gradient p-5 rounded-2xl text-slate-950 shadow-xl gold-border-glow relative overflow-hidden">
                                    <div className="absolute -right-6 -bottom-6 opacity-15 text-9xl">
                                        <i className="fa-solid fa-coins"></i>
                                    </div>
                                    <p className="text-xs font-bold uppercase tracking-wider text-slate-900/80">Total Kekayaan (Net Worth)</p>
                                    <h2 className="text-2xl font-black mt-1 tracking-tight">
                                        {formatIDR(totalNetWorth)}
                                    </h2>

                                    <div className="mt-4 pt-3 border-t border-slate-950/20 grid grid-cols-2 gap-2 text-xs">
                                        <div>
                                            <p className="text-[10px] text-slate-900/70 uppercase font-semibold">Kas & Bank</p>
                                            <p className="font-bold text-slate-950">{formatIDR(totalLiquid)}</p>
                                        </div>
                                        <div>
                                            <p className="text-[10px] text-slate-900/70 uppercase font-semibold">Investasi</p>
                                            <p className="font-bold text-slate-950">{formatIDR(totalInvest)}</p>
                                        </div>
                                    </div>
                                </div>

                                {/* Smart Voice & Image Scan Action Bar */}
                                <div className="bg-slate-100 dark:bg-slate-800/60 p-2 rounded-xl border border-slate-200 dark:border-slate-800 flex items-center justify-between gap-2">
                                    <button 
                                        onClick={handleVoiceInput}
                                        className={`flex-1 flex items-center justify-center gap-2 py-2 px-3 rounded-lg border text-xs font-semibold transition ${
                                            isListening ? 'bg-red-500 text-white border-red-500 animate-pulse' : 'bg-white dark:bg-slate-800 border-slate-300 dark:border-slate-700 text-slate-700 dark:text-slate-200'
                                        }`}
                                    >
                                        <i className="fa-solid fa-microphone text-gold-500"></i>
                                        <span>{isListening ? 'Mendengarkan...' : 'Input Voice'}</span>
                                    </button>

                                    <label className="flex-1 flex items-center justify-center gap-2 py-2 px-3 rounded-lg bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-700 text-slate-700 dark:text-slate-200 text-xs font-semibold cursor-pointer transition">
                                        <i className="fa-solid fa-camera text-gold-500"></i>
                                        <span>{isScanning ? `Scan (${ocrProgress}%)` : 'Scan Struk'}</span>
                                        <input type="file" accept="image/*" onChange={handleImageScanReal} className="hidden" disabled={isScanning} />
                                    </label>
                                </div>

                                    <div>
                                        <label className="text-[10px] font-semibold text-slate-400 block mb-1">Saldo Awal (Rp)</label>
                                        <input type="text" placeholder="0" value={newFormattedBalance} onChange={e => handleAmountChange(e, setNewFormattedBalance)} className="w-full bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl px-3 py-2 text-xs focus:outline-none font-bold" required />
                                        {newFormattedBalance && (
                                            <p className="text-[11px] text-amber-500 font-semibold mt-1 italic">
                                                {terbilangIDR(newFormattedBalance)}
                                            </p>
                                        )}
                                    </div>

                                    <button type="submit" className="w-full py-2.5 gold-gradient text-slate-950 font-bold rounded-xl text-xs">Simpan Akun</button>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* MODAL TAMBAH TARGET TABUNGAN */}
                    {isGoalModalOpen && (
                        <div className="absolute inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div className="bg-white dark:bg-slate-900 w-full max-w-md rounded-2xl border border-slate-200 dark:border-slate-800 p-5 space-y-4">
                                <div className="flex justify-between items-center border-b border-slate-200 dark:border-slate-800 pb-3">
                                    <h3 className="text-sm font-bold">Tambah Target Tabungan</h3>
                                    <button onClick={() => setIsGoalModalOpen(false)} className="text-slate-400">
                                        <i className="fa-solid fa-xmark text-lg"></i>
                                    </button>
                                </div>

                                <form onSubmit={handleAddGoal} className="space-y-3">
                                    <div>
                                        <label className="text-[10px] font-semibold text-slate-400 block mb-1">Judul Target (misal: Beli MacBook / Mobil)</label>
                                        <input type="text" placeholder="Judul Target..." value={newGoalTitle} onChange={e => setNewGoalTitle(e.target.value)} className="w-full bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl px-3 py-2 text-xs focus:outline-none" required />
                                    </div>

                                    <div>
                                        <label className="text-[10px] font-semibold text-slate-400 block mb-1">Target Nominal (Rp)</label>
                                        <input type="text" placeholder="0" value={newGoalTargetFormatted} onChange={e => handleAmountChange(e, setNewGoalTargetFormatted)} className="w-full bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl px-3 py-2 text-xs focus:outline-none font-bold" required />
                                        {newGoalTargetFormatted && (
                                            <p className="text-[11px] text-amber-500 font-semibold mt-1 italic">
                                                {terbilangIDR(newGoalTargetFormatted)}
                                            </p>
                                        )}
                                    </div>

                                    <div>
                                        <label className="text-[10px] font-semibold text-slate-400 block mb-1">Tabungan Terkumpul Saat Ini (Rp)</label>
                                        <input type="text" placeholder="0" value={newGoalCurrentFormatted} onChange={e => handleAmountChange(e, setNewGoalCurrentFormatted)} className="w-full bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl px-3 py-2 text-xs focus:outline-none font-bold" />
                                    </div>

                                    <button type="submit" className="w-full py-2.5 gold-gradient text-slate-950 font-bold rounded-xl text-xs">Simpan Target</button>
                                </form>
                            </div>
                        </div>
                    )}

                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
