<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Personal Finance Tracker</title>

  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: { extend: { colors: { brand: {
        50: '#f0fdf4', 100: '#dcfce7', 200: '#bbf7d0', 300: '#86efac', 400: '#4ade80',
        500: '#22c55e', 600: '#16a34a', 700: '#15803d', 800: '#166534', 900: '#14532d', 950: '#052e16'
      } } } }
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js" crossorigin></script>
  <script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.24.7/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4.1.1/dist/tesseract.min.js"></script>

  <style>
    body { touch-action: manipulation; -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .pulse-animation { animation: pulse-ring 1.5s cubic-bezier(0.215, 0.61, 0.355, 1) infinite; }
    @keyframes pulse-ring {
      0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7); }
      70% { transform: scale(1.05); box-shadow: 0 0 0 15px rgba(34, 197, 94, 0); }
      100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
    }
  </style>
</head>
<body class="bg-gray-100 dark:bg-gray-950 text-gray-900 dark:text-gray-100 antialiased selection:bg-brand-500 selection:text-white">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    /* ---------- Helpers ---------- */
    const formatIDR = (val) => {
      if (val === null || val === undefined || val === '' || isNaN(val)) return '0';
      return new Intl.NumberFormat('id-ID').format(val);
    };
    const parseIDR = (s) => parseInt(String(s || '').replace(/\./g, ''), 10) || 0;
    const today = () => new Date().toISOString().split('T')[0];

    const load = (key, fallback) => {
      try {
        const raw = localStorage.getItem(key);
        return raw ? JSON.parse(raw) : fallback;
      } catch (e) { return fallback; }
    };

    const terbilang = (angka) => {
      const bil = ["", "Satu", "Dua", "Tiga", "Empat", "Lima", "Enam", "Tujuh", "Delapan", "Sembilan", "Sepuluh", "Sebelas"];
      const num = Math.abs(parseInt(angka, 10));
      if (isNaN(num) || num === 0) return "";
      const t = terbilang;
      let res = "";
      if (num < 12) res = bil[num];
      else if (num < 20) res = t(num - 10) + " Belas";
      else if (num < 100) res = t(Math.floor(num / 10)) + " Puluh " + t(num % 10);
      else if (num < 200) res = "Seratus " + t(num - 100);
      else if (num < 1000) res = t(Math.floor(num / 100)) + " Ratus " + t(num % 100);
      else if (num < 2000) res = "Seribu " + t(num - 1000);
      else if (num < 1e6) res = t(Math.floor(num / 1e3)) + " Ribu " + t(num % 1e3);
      else if (num < 1e9) res = t(Math.floor(num / 1e6)) + " Juta " + t(num % 1e6);
      else if (num < 1e12) res = t(Math.floor(num / 1e9)) + " Miliar " + t(num % 1e9);
      return res.replace(/\s+/g, ' ').trim();
    };

    const CATEGORIES = {
      Pengeluaran: ['Makanan', 'Transportasi', 'Belanja', 'Tagihan & Utilitas', 'Hiburan', 'Kesehatan', 'Pendidikan', 'Lainnya'],
      Pemasukan: ['Gaji', 'Bonus', 'Investasi', 'Hasil Usaha', 'Hadiah', 'Lainnya']
    };

    /* ---------- Icons (SVG inline, aman untuk React) ---------- */
    const ICONS = {
      sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>',
      moon: '<path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>',
      upload: '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/>',
      download: '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/>',
      eye: '<path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/>',
      'eye-off': '<path d="M9.88 9.88a3 3 0 1 0 4.24 4.24M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68M6.61 6.61A13.53 13.53 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61M2 2l20 20"/>',
      mic: '<path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3ZM19 10v2a7 7 0 0 1-14 0v-2M12 19v3"/>',
      'mic-off': '<path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3ZM19 10v2a7 7 0 0 1-14 0v-2M12 19v3M2 2l20 20"/>',
      x: '<path d="M18 6 6 18M6 6l12 12"/>',
      'arrow-up-right': '<path d="M7 7h10v10M7 17 17 7"/>',
      'arrow-down-left': '<path d="M17 7 7 17M17 17H7V7"/>',
      repeat: '<path d="m17 2 4 4-4 4M3 11v-1a4 4 0 0 1 4-4h14M7 22l-4-4 4-4M21 13v1a4 4 0 0 1-4 4H3"/>',
      scan: '<path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2M7 12h10"/>',
      landmark: '<path d="M3 22h18M6 18v-7M10 18v-7M14 18v-7M18 18v-7M12 2 3 7h18l-9-5Z"/>',
      wallet: '<path d="M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4"/>',
      'trending-up': '<path d="m22 7-8.5 8.5-5-5L2 17M16 7h6v6"/>',
      'trash-2': '<path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M10 11v6M14 11v6"/>',
      home: '<path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2zM9 22V12h6v10"/>',
      receipt: '<path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1ZM16 8h-6a2 2 0 1 0 0 4h4a2 2 0 1 1 0 4H8M12 17.5v-11"/>',
      target: '<circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/>',
      'plus-circle': '<circle cx="12" cy="12" r="10"/><path d="M8 12h8M12 8v8"/>'
    };

    const Icon = ({ name, className = 'w-5 h-5' }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"
        strokeLinecap="round" strokeLinejoin="round" aria-hidden="true"
        dangerouslySetInnerHTML={{ __html: ICONS[name] || '' }} />
    );

    /* ---------- UI kecil ---------- */
    const INPUT = "w-full mt-1 p-2.5 rounded-xl bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 text-xs font-semibold text-gray-900 dark:text-gray-100 focus:outline-none focus:ring-2 focus:ring-brand-500";
    const SUBMIT = "w-full py-3 bg-brand-600 hover:bg-brand-500 text-white font-bold text-sm rounded-xl shadow-lg transition";

    const Modal = ({ title, onClose, bottom, children }) => (
      <div className={`fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex justify-center ${bottom ? 'items-end sm:items-center p-0 sm:p-4' : 'items-center p-4'}`}>
        <div className={`w-full max-w-md bg-white dark:bg-gray-900 p-6 space-y-4 shadow-2xl border border-gray-200 dark:border-gray-800 ${bottom ? 'rounded-t-3xl sm:rounded-3xl' : 'rounded-3xl'}`}>
          <div className="flex items-center justify-between border-b border-gray-100 dark:border-gray-800 pb-3">
            <h3 className="text-base font-bold text-gray-900 dark:text-gray-100">{title}</h3>
            <button type="button" onClick={onClose} className="text-gray-400"><Icon name="x" /></button>
          </div>
          {children}
        </div>
      </div>
    );

    const Field = ({ label, children }) => (
      <div>
        <label className="text-xs font-medium text-gray-500">{label}</label>
        {children}
      </div>
    );

    const Empty = ({ children }) => (
      <div className="p-6 text-center text-xs text-gray-400 bg-white dark:bg-gray-900 rounded-2xl border border-gray-200 dark:border-gray-800">{children}</div>
    );

    /* ---------- App ---------- */
    function App() {
      const [isDarkMode, setIsDarkMode] = useState(() => localStorage.getItem('pft_theme') !== 'light');
      const [hideBalance, setHideBalance] = useState(() => localStorage.getItem('pft_hide_bal') === 'true');
      const [accounts, setAccounts] = useState(() => load('pft_accounts', []));
      const [transactions, setTransactions] = useState(() => load('pft_transactions', []));
      const [goals, setGoals] = useState(() => load('pft_goals', []));

      const [activeTab, setActiveTab] = useState('home');
      const [isFormOpen, setIsFormOpen] = useState(false);
      const [isVoiceListening, setIsVoiceListening] = useState(false);
      const [voiceTranscript, setVoiceTranscript] = useState('');
      const [ocrProcessing, setOcrProcessing] = useState(false);

      // Form transaksi
      const [formType, setFormType] = useState('Pengeluaran');
      const [formAmount, setFormAmount] = useState('');
      const [formCategory, setFormCategory] = useState('Makanan');
      const [formAccountId, setFormAccountId] = useState('');
      const [formToAccountId, setFormToAccountId] = useState('');
      const [formNote, setFormNote] = useState('');
      const [formDate] = useState(today());

      // Modal rekening
      const [isAccModalOpen, setIsAccModalOpen] = useState(false);
      const [accName, setAccName] = useState('');
      const [accType, setAccType] = useState('Bank');
      const [accBalance, setAccBalance] = useState('');

      // Modal target
      const [isGoalModalOpen, setIsGoalModalOpen] = useState(false);
      const [goalTitle, setGoalTitle] = useState('');
      const [goalTarget, setGoalTarget] = useState('');
      const [goalSaved, setGoalSaved] = useState('');

      // Modal setor target
      const [selectedGoal, setSelectedGoal] = useState(null);
      const [goalDepositAmount, setGoalDepositAmount] = useState('');
      const [goalDepositAccId, setGoalDepositAccId] = useState('');

      /* Simpan ke localStorage */
      useEffect(() => { localStorage.setItem('pft_accounts', JSON.stringify(accounts)); }, [accounts]);
      useEffect(() => { localStorage.setItem('pft_transactions', JSON.stringify(transactions)); }, [transactions]);
      useEffect(() => { localStorage.setItem('pft_goals', JSON.stringify(goals)); }, [goals]);
      useEffect(() => { localStorage.setItem('pft_hide_bal', hideBalance ? 'true' : 'false'); }, [hideBalance]);
      useEffect(() => {
        localStorage.setItem('pft_theme', isDarkMode ? 'dark' : 'light');
        document.documentElement.classList.toggle('dark', isDarkMode);
      }, [isDarkMode]);

      /* Tampilan nominal (ikut tersembunyi saat hide aktif) */
      const money = (v) => (hideBalance ? 'Rp ••••••••' : `Rp ${formatIDR(v)}`);
      const signed = (tx) => {
        if (hideBalance) return 'Rp ••••••••';
        const sign = tx.type === 'Pemasukan' ? '+ ' : tx.type === 'Transfer' ? '' : '- ';
        return `${sign}Rp ${formatIDR(tx.amount)}`;
      };

      const totalNetWorth = useMemo(
        () => accounts.reduce((acc, curr) => acc + Number(curr.balance || 0), 0),
        [accounts]
      );

      /* Buka form */
      const openForm = (type = formType) => {
        setFormType(type);
        setFormCategory((CATEGORIES[type] || [])[0] || '');
        if (accounts.length > 0) {
          setFormAccountId(accounts[0].id);
          setFormToAccountId((accounts[1] || accounts[0]).id);
        }
        setIsFormOpen(true);
      };

      const changeFormType = (t) => {
        setFormType(t);
        if (CATEGORIES[t] && !CATEGORIES[t].includes(formCategory)) setFormCategory(CATEGORIES[t][0]);
      };

      /* ---------- Suara ---------- */
      const startVoiceRecognition = () => {
        const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SR) {
          alert('Browser HP Anda belum mendukung fitur Voice Speech Recognition.');
          return;
        }
        const recognition = new SR();
        recognition.lang = 'id-ID';
        recognition.continuous = false;
        recognition.interimResults = false;

        setIsVoiceListening(true);
        setVoiceTranscript('Mendengarkan ucapan Anda...');

        recognition.onresult = (event) => {
          const speechResult = event.results[0][0].transcript.toLowerCase();
          setVoiceTranscript(`"${speechResult}"`);
          parseVoiceCommand(speechResult);
          setIsVoiceListening(false);
        };
        recognition.onerror = () => {
          setVoiceTranscript('Gagal mengenali suara. Silakan coba lagi.');
          setIsVoiceListening(false);
        };
        recognition.onend = () => setIsVoiceListening(false);
        recognition.start();
      };

      const parseVoiceCommand = (text) => {
        let type = 'Pengeluaran';
        if (/(pemasukan|dapat|gaji|terima|masuk)/.test(text)) type = 'Pemasukan';
        else if (/(transfer|pindah)/.test(text)) type = 'Transfer';
        openForm(type);

        let amount = 0;
        const words = { se: 1, satu: 1, dua: 2, tiga: 3, empat: 4, lima: 5 };
        if (text.includes('juta')) {
          const m = text.match(/(\d+|\bse\b|\bsatu\b|\bdua\b|\btiga\b|\bempat\b|\blima\b)\s*juta/i);
          if (m) amount = (isNaN(m[1]) ? words[m[1]] : parseInt(m[1], 10)) * 1000000;
        } else if (text.includes('ribu') || text.includes('rb')) {
          const m = text.match(/(\d+)\s*(ribu|rb)/i);
          if (m) amount = parseInt(m[1], 10) * 1000;
        }
        const nums = text.match(/\d+/g);
        if (!amount && nums) amount = parseInt(nums.join(''), 10);
        if (amount) setFormAmount(formatIDR(amount));

        const foundAcc = accounts.find(a => text.includes(a.name.toLowerCase()) || text.includes(a.type.toLowerCase()));
        if (foundAcc) setFormAccountId(foundAcc.id);

        if (type !== 'Transfer') {
          const foundCat = (CATEGORIES[type] || []).find(c => text.includes(c.toLowerCase()));
          if (foundCat) setFormCategory(foundCat);
          else if (/(bensin|parkir|ojek)/.test(text)) setFormCategory('Transportasi');
          else if (/(makan|minum|kopi)/.test(text)) setFormCategory('Makanan');
          else if (/(beli|baju)/.test(text)) setFormCategory('Belanja');
        }
        setFormNote(text);
      };

      /* ---------- OCR ---------- */
      const handleImageOCR = (e) => {
        const file = e.target.files[0];
        e.target.value = '';
        if (!file) return;
        setOcrProcessing(true);
        Tesseract.recognize(file, 'ind+eng').then(({ data: { text } }) => {
          setOcrProcessing(false);
          openForm('Pengeluaran');
          const m = text.toLowerCase().match(/(total|amount|jumlah|rp\.?)\s*([\d\.,]+)/i);
          if (m) {
            const raw = m[2].replace(/[^\d]/g, '');
            if (raw) setFormAmount(formatIDR(raw));
          }
          setFormNote(`Scan Struk: ${text.slice(0, 40).replace(/\s+/g, ' ')}...`);
        }).catch(() => {
          setOcrProcessing(false);
          alert('Gagal membaca gambar.');
        });
      };

      const handleAmountChange = (e) => {
        const raw = e.target.value.replace(/[^\d]/g, '');
        setFormAmount(raw ? formatIDR(raw) : '');
      };

      /* ---------- Transaksi ---------- */
      const handleSaveTransaction = (e) => {
        e.preventDefault();
        const amount = parseIDR(formAmount);
        if (amount <= 0) { alert('Masukkan nominal angka yang valid.'); return; }
        if (accounts.length === 0) { alert('Silakan buat rekening/aset terlebih dahulu.'); return; }

        const fromId = formAccountId || accounts[0].id;
        const toId = formToAccountId || (accounts[1] || accounts[0]).id;
        const fromAcc = accounts.find(a => a.id === fromId);
        if (!fromAcc) { alert('Rekening tidak ditemukan.'); return; }

        if (formType === 'Transfer') {
          if (fromId === toId) { alert('Rekening asal dan tujuan tidak boleh sama.'); return; }
          if (fromAcc.balance < amount) { alert('Saldo rekening asal tidak mencukupi.'); return; }
          setAccounts(prev => prev.map(a =>
            a.id === fromId ? { ...a, balance: a.balance - amount } :
            a.id === toId ? { ...a, balance: a.balance + amount } : a));
        } else {
          const delta = formType === 'Pemasukan' ? amount : -amount;
          setAccounts(prev => prev.map(a => a.id === fromId ? { ...a, balance: a.balance + delta } : a));
        }

        const newTx = {
          id: 'tx-' + Date.now(),
          type: formType,
          amount,
          category: formType === 'Transfer' ? 'Transfer' : formCategory,
          accountId: fromId,
          toAccountId: formType === 'Transfer' ? toId : null,
          note: formNote || (formType === 'Transfer' ? 'Transfer Antar Rekening' : formCategory),
          date: formDate
        };
        setTransactions(prev => [newTx, ...prev]);
        setFormAmount('');
        setFormNote('');
        setIsFormOpen(false);
      };

      /* ---------- Rekening ---------- */
      const handleSaveAccount = (e) => {
        e.preventDefault();
        const newAcc = {
          id: 'acc-' + Date.now(),
          name: accName.trim(),
          type: accType,
          balance: parseIDR(accBalance),
          color: accType === 'Bank' ? 'bg-blue-600' : accType === 'Cash' ? 'bg-emerald-600' : 'bg-purple-600'
        };
        setAccounts(prev => [...prev, newAcc]);
        setAccName(''); setAccBalance(''); setAccType('Bank');
        setIsAccModalOpen(false);
      };

      const handleDeleteAccount = (acc) => {
        if (confirm(`Apakah Anda yakin ingin menghapus rekening "${acc.name}"?\nSisa saldo saat ini: ${money(acc.balance)}`)) {
          setAccounts(prev => prev.filter(a => a.id !== acc.id));
        }
      };

      /* ---------- Target ---------- */
      const handleSaveGoal = (e) => {
        e.preventDefault();
        const newGoal = {
          id: 'goal-' + Date.now(),
          title: goalTitle.trim(),
          target: parseIDR(goalTarget),
          saved: parseIDR(goalSaved)
        };
        setGoals(prev => [...prev, newGoal]);
        setGoalTitle(''); setGoalTarget(''); setGoalSaved('');
        setIsGoalModalOpen(false);
      };

      const handleDepositToGoal = (e) => {
        e.preventDefault();
        const amount = parseIDR(goalDepositAmount);
        if (amount <= 0) return;
        const src = accounts.find(a => a.id === goalDepositAccId);
        if (!src || src.balance < amount) { alert('Saldo rekening tidak mencukupi.'); return; }

        setAccounts(prev => prev.map(a => a.id === src.id ? { ...a, balance: a.balance - amount } : a));
        setGoals(prev => prev.map(g => g.id === selectedGoal.id ? { ...g, saved: g.saved + amount } : g));
        setTransactions(prev => [{
          id: 'tx-' + Date.now(),
          type: 'Pengeluaran',
          amount,
          category: 'Tabungan',
          accountId: src.id,
          note: `Setor Target: ${selectedGoal.title}`,
          date: today()
        }, ...prev]);
        setSelectedGoal(null);
        setGoalDepositAmount('');
      };

      /* ---------- Backup ---------- */
      const exportData = () => {
        const blob = new Blob([JSON.stringify({ accounts, transactions, goals }, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `backup_keuangan_${today()}.json`;
        a.click();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      };

      const importData = (e) => {
        const file = e.target.files[0];
        e.target.value = '';
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            const p = JSON.parse(event.target.result);
            if (Array.isArray(p.accounts) && Array.isArray(p.transactions)) {
              setAccounts(p.accounts);
              setTransactions(p.transactions);
              if (Array.isArray(p.goals)) setGoals(p.goals);
              alert('Data berhasil dipulihkan!');
            } else {
              alert('Format file backup tidak sesuai.');
            }
          } catch (err) {
            alert('File JSON tidak valid.');
          }
        };
        reader.readAsText(file);
      };

      /* ---------- Render ---------- */
      const txStyle = (type) =>
        type === 'Pemasukan' ? { box: 'bg-emerald-100 text-emerald-600 dark:bg-emerald-950/50', text: 'text-emerald-600 dark:text-emerald-400', icon: 'arrow-down-left' } :
        type === 'Transfer' ? { box: 'bg-blue-100 text-blue-600 dark:bg-blue-950/50', text: 'text-blue-600 dark:text-blue-400', icon: 'repeat' } :
        { box: 'bg-red-100 text-red-600 dark:bg-red-950/50', text: 'text-red-600 dark:text-red-400', icon: 'arrow-up-right' };

      const shortcutBtn = "p-3 rounded-2xl bg-white dark:bg-gray-900 border border-gray-200 dark:border-gray-800 flex flex-col items-center justify-center space-y-1 shadow-sm active:scale-95 transition";
      const iconBtn = "p-2 rounded-xl text-gray-600 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-gray-800 transition";
      const navCls = (tab) => `flex flex-col items-center space-y-1 ${activeTab === tab ? 'text-brand-600 dark:text-brand-400' : 'text-gray-400'}`;

      return (
        <div className="max-w-md mx-auto min-h-screen pb-24 relative flex flex-col bg-gray-50 dark:bg-gray-950 shadow-2xl border-x border-gray-200 dark:border-gray-800">

          {/* TOP NAVBAR */}
          <header className="sticky top-0 z-30 backdrop-blur-md bg-white/80 dark:bg-gray-900/80 border-b border-gray-200 dark:border-gray-800 px-4 py-3 flex items-center justify-between">
            <div className="flex items-center space-x-3">
              <div className="w-10 h-10 rounded-full bg-brand-600 text-white flex items-center justify-center font-bold text-lg shadow-md">P</div>
              <div>
                <h1 className="text-xs text-gray-500 dark:text-gray-400 font-medium">Personal Finance</h1>
                <p className="text-sm font-semibold text-gray-900 dark:text-gray-100">Vault Utama</p>
              </div>
            </div>
            <div className="flex items-center space-x-2">
              <button type="button" onClick={() => setIsDarkMode(d => !d)} className={iconBtn}>
                <Icon name={isDarkMode ? 'sun' : 'moon'} />
              </button>
              <label className={`${iconBtn} cursor-pointer`}>
                <Icon name="upload" />
                <input type="file" accept=".json" onChange={importData} className="hidden" />
              </label>
              <button type="button" onClick={exportData} className={iconBtn}>
                <Icon name="download" />
              </button>
            </div>
          </header>

          {/* MAIN */}
          <main className="flex-1 p-4 space-y-5">

            {(voiceTranscript || ocrProcessing) && (
              <div className="p-3 bg-brand-50 dark:bg-brand-950/40 border border-brand-200 dark:border-brand-800/50 rounded-2xl flex items-center justify-between">
                <div className="flex items-center space-x-2 text-brand-700 dark:text-brand-300 text-xs">
                  <Icon name="mic" className="w-4 h-4 animate-pulse" />
                  <span>{ocrProcessing ? 'Membaca struk...' : voiceTranscript}</span>
                </div>
                {!ocrProcessing && (
                  <button type="button" onClick={() => setVoiceTranscript('')} className="text-gray-400 hover:text-gray-600">
                    <Icon name="x" className="w-4 h-4" />
                  </button>
                )}
              </div>
            )}

            {/* HOME */}
            {activeTab === 'home' && (
              <>
                <div className="relative overflow-hidden rounded-3xl bg-gradient-to-br from-gray-900 via-gray-800 to-gray-900 dark:from-gray-900 dark:via-gray-950 dark:to-black text-white p-6 shadow-xl border border-gray-800">
                  <div className="absolute top-0 right-0 -mt-8 -mr-8 w-32 h-32 bg-brand-500/10 rounded-full blur-2xl pointer-events-none"></div>

                  <div className="flex items-center justify-between mb-2">
                    <span className="text-xs uppercase tracking-wider text-gray-400 font-medium">Total Kekayaan Bersih</span>
                    <button
                      type="button"
                      onClick={() => setHideBalance(h => !h)}
                      aria-label={hideBalance ? 'Tampilkan saldo' : 'Sembunyikan saldo'}
                      className="relative z-10 text-gray-300 hover:text-white transition p-2 rounded-xl bg-gray-800/60 active:scale-90"
                    >
                      <Icon name={hideBalance ? 'eye-off' : 'eye'} />
                    </button>
                  </div>

                  <div className="text-3xl font-extrabold tracking-tight mb-6">{money(totalNetWorth)}</div>

                  <div className="grid grid-cols-2 gap-3 pt-4 border-t border-gray-800/80 text-xs">
                    <div>
                      <span className="text-gray-400 block mb-0.5">Total Rekening</span>
                      <span className="font-semibold text-gray-200">{accounts.length} Akun Aktif</span>
                    </div>
                    <div>
                      <span className="text-gray-400 block mb-0.5">Target Tabungan</span>
                      <span className="font-semibold text-gray-200">{goals.length} Target</span>
                    </div>
                  </div>
                </div>

                {/* SHORTCUTS */}
                <div className="grid grid-cols-4 gap-3">
                  <button type="button" onClick={() => openForm('Pengeluaran')} className={shortcutBtn}>
                    <div className="w-10 h-10 rounded-xl bg-red-100 dark:bg-red-950/50 text-red-600 flex items-center justify-center"><Icon name="arrow-up-right" /></div>
                    <span className="text-[11px] font-medium text-gray-700 dark:text-gray-300">Bayar</span>
                  </button>
                  <button type="button" onClick={() => openForm('Pemasukan')} className={shortcutBtn}>
                    <div className="w-10 h-10 rounded-xl bg-emerald-100 dark:bg-emerald-950/50 text-emerald-600 flex items-center justify-center"><Icon name="arrow-down-left" /></div>
                    <span className="text-[11px] font-medium text-gray-700 dark:text-gray-300">Terima</span>
                  </button>
                  <button type="button" onClick={() => openForm('Transfer')} className={shortcutBtn}>
                    <div className="w-10 h-10 rounded-xl bg-blue-100 dark:bg-blue-950/50 text-blue-600 flex items-center justify-center"><Icon name="repeat" /></div>
                    <span className="text-[11px] font-medium text-gray-700 dark:text-gray-300">Transfer</span>
                  </button>
                  <label className={`${shortcutBtn} cursor-pointer`}>
                    <div className="w-10 h-10 rounded-xl bg-purple-100 dark:bg-purple-950/50 text-purple-600 flex items-center justify-center"><Icon name="scan" /></div>
                    <span className="text-[11px] font-medium text-gray-700 dark:text-gray-300">Scan</span>
                    <input type="file" accept="image/*" onChange={handleImageOCR} className="hidden" />
                  </label>
                </div>

                {/* REKENING */}
                <div className="space-y-3">
                  <div className="flex items-center justify-between">
                    <h2 className="text-sm font-bold text-gray-900 dark:text-gray-100 uppercase tracking-wider">Rekening & Aset</h2>
                    <button type="button" onClick={() => setIsAccModalOpen(true)} className="text-xs font-semibold text-brand-600 hover:underline">+ Tambah</button>
                  </div>

                  {accounts.length === 0 ? (
                    <Empty>Belum ada rekening. Klik "+ Tambah" untuk mulai mendata rekening/asetmu.</Empty>
                  ) : (
                    <div className="space-y-2">
                      {accounts.map(acc => (
                        <div key={acc.id} className="p-4 rounded-2xl bg-white dark:bg-gray-900 border border-gray-200/80 dark:border-gray-800 flex items-center justify-between shadow-sm">
                          <div className="flex items-center space-x-3">
                            <div className={`w-10 h-10 rounded-xl ${acc.color} text-white flex items-center justify-center shadow-md`}>
                              <Icon name={acc.type === 'Bank' ? 'landmark' : acc.type === 'Cash' ? 'wallet' : 'trending-up'} />
                            </div>
                            <div>
                              <h3 className="text-sm font-semibold text-gray-900 dark:text-gray-100">{acc.name}</h3>
                              <span className="text-[11px] text-gray-400">{acc.type}</span>
                            </div>
                          </div>
                          <div className="flex items-center space-x-3">
                            <span className="text-sm font-bold text-gray-900 dark:text-gray-100">{money(acc.balance)}</span>
                            <button type="button" onClick={() => handleDeleteAccount(acc)} title="Hapus Rekening"
                              className="p-1.5 rounded-lg text-gray-400 hover:text-red-500 hover:bg-red-50 dark:hover:bg-red-950/40 transition">
                              <Icon name="trash-2" className="w-4 h-4" />
                            </button>
                          </div>
                        </div>
                      ))}
                    </div>
                  )}
                </div>

                {/* TRANSAKSI TERAKHIR */}
                <div className="space-y-3">
                  <div className="flex items-center justify-between">
                    <h2 className="text-sm font-bold text-gray-900 dark:text-gray-100 uppercase tracking-wider">Transaksi Terakhir</h2>
                    <button type="button" onClick={() => setActiveTab('history')} className="text-xs font-semibold text-brand-600 hover:underline">Lihat Semua</button>
                  </div>

                  {transactions.length === 0 ? (
                    <Empty>Belum ada catatan transaksi.</Empty>
                  ) : (
                    <div className="space-y-2">
                      {transactions.slice(0, 5).map(tx => {
                        const acc = accounts.find(a => a.id === tx.accountId);
                        const s = txStyle(tx.type);
                        return (
                          <div key={tx.id} className="p-3.5 rounded-2xl bg-white dark:bg-gray-900 border border-gray-200/80 dark:border-gray-800 flex items-center justify-between shadow-sm">
                            <div className="flex items-center space-x-3">
                              <div className={`w-9 h-9 rounded-xl flex items-center justify-center ${s.box}`}>
                                <Icon name={s.icon} className="w-4 h-4" />
                              </div>
                              <div>
                                <h4 className="text-xs font-semibold text-gray-900 dark:text-gray-100">{tx.note || tx.category}</h4>
                                <span className="text-[10px] text-gray-400">{acc?.name || 'Rekening Dihapus'} • {tx.date}</span>
                              </div>
                            </div>
                            <span className={`text-xs font-bold ${s.text}`}>{signed(tx)}</span>
                          </div>
                        );
                      })}
                    </div>
                  )}
                </div>
              </>
            )}

            {/* HISTORY */}
            {activeTab === 'history' && (
              <div className="space-y-4">
                <h2 className="text-base font-bold text-gray-900 dark:text-gray-100">Riwayat Transaksi</h2>
                {transactions.length === 0 ? (
                  <p className="text-xs text-gray-400 text-center py-8">Belum ada transaksi.</p>
                ) : (
                  <div className="space-y-2">
                    {transactions.map(tx => {
                      const acc = accounts.find(a => a.id === tx.accountId);
                      const s = txStyle(tx.type);
                      return (
                        <div key={tx.id} className="p-4 rounded-2xl bg-white dark:bg-gray-900 border border-gray-200 dark:border-gray-800 flex items-center justify-between">
                          <div>
                            <h4 className="text-xs font-bold text-gray-900 dark:text-gray-100">{tx.note || tx.category}</h4>
                            <p className="text-[11px] text-gray-400">{tx.category} • {acc?.name || 'Rekening Dihapus'} • {tx.date}</p>
                          </div>
                          <span className={`text-xs font-extrabold ${s.text}`}>{signed(tx)}</span>
                        </div>
                      );
                    })}
                  </div>
                )}
              </div>
            )}

            {/* GOALS */}
            {activeTab === 'goals' && (
              <div className="space-y-4">
                <div className="flex items-center justify-between">
                  <h2 className="text-base font-bold text-gray-900 dark:text-gray-100">Target Tabungan</h2>
                  <button type="button" onClick={() => setIsGoalModalOpen(true)} className="text-xs font-semibold text-brand-600 hover:underline">+ Target Baru</button>
                </div>

                {goals.length === 0 ? (
                  <Empty>Belum ada target tabungan.</Empty>
                ) : (
                  <div className="space-y-3">
                    {goals.map(goal => {
                      const percent = goal.target > 0 ? Math.min(100, Math.round((goal.saved / goal.target) * 100)) : 0;
                      return (
                        <div key={goal.id} className="p-4 rounded-2xl bg-white dark:bg-gray-900 border border-gray-200 dark:border-gray-800 space-y-3">
                          <div className="flex items-center justify-between">
                            <h3 className="text-sm font-bold text-gray-900 dark:text-gray-100">{goal.title}</h3>
                            <span className="text-xs font-bold text-brand-600">{percent}%</span>
                          </div>
                          <div className="w-full h-2.5 bg-gray-200 dark:bg-gray-800 rounded-full overflow-hidden">
                            <div className="h-full bg-brand-500 rounded-full" style={{ width: `${percent}%` }}></div>
                          </div>
                          <div className="flex items-center justify-between text-xs text-gray-400">
                            <span>Terkumpul: {money(goal.saved)}</span>
                            <span>Target: {money(goal.target)}</span>
                          </div>
                          <button type="button"
                            onClick={() => { setSelectedGoal(goal); if (accounts.length > 0) setGoalDepositAccId(accounts[0].id); }}
                            className="w-full py-2 bg-brand-50 dark:bg-brand-950/50 text-brand-600 dark:text-brand-400 text-xs font-semibold rounded-xl border border-brand-200 dark:border-brand-800">
                            + Setor Dana Ke Target Ini
                          </button>
                        </div>
                      );
                    })}
                  </div>
                )}
              </div>
            )}
          </main>

          {/* BOTTOM NAV */}
          <nav className="fixed bottom-0 left-0 right-0 max-w-md mx-auto z-40 bg-white/90 dark:bg-gray-900/90 backdrop-blur-lg border-t border-gray-200 dark:border-gray-800 px-4 py-2 flex items-center justify-between">
            <button type="button" onClick={() => setActiveTab('home')} className={navCls('home')}>
              <Icon name="home" /><span className="text-[10px] font-medium">Beranda</span>
            </button>
            <button type="button" onClick={() => setActiveTab('history')} className={navCls('history')}>
              <Icon name="receipt" /><span className="text-[10px] font-medium">Riwayat</span>
            </button>

            <div className="relative -top-5">
              <button type="button" onClick={startVoiceRecognition}
                className={`w-14 h-14 rounded-full text-white shadow-xl flex items-center justify-center transition active:scale-90 ${
                  isVoiceListening ? 'bg-red-500 pulse-animation' : 'bg-brand-600 hover:bg-brand-500 shadow-brand-500/40'}`}>
                <Icon name={isVoiceListening ? 'mic-off' : 'mic'} className="w-7 h-7" />
              </button>
            </div>

            <button type="button" onClick={() => setActiveTab('goals')} className={navCls('goals')}>
              <Icon name="target" /><span className="text-[10px] font-medium">Target</span>
            </button>
            <button type="button" onClick={() => openForm()} className="flex flex-col items-center space-y-1 text-gray-400 hover:text-gray-600">
              <Icon name="plus-circle" /><span className="text-[10px] font-medium">Tambah</span>
            </button>
          </nav>

          {/* MODAL TRANSAKSI */}
          {isFormOpen && (
            <Modal title="Catat Transaksi" bottom onClose={() => setIsFormOpen(false)}>
              <form onSubmit={handleSaveTransaction} className="space-y-4">
                <div className="grid grid-cols-3 gap-1 bg-gray-100 dark:bg-gray-800 p-1 rounded-xl text-xs font-semibold">
                  {['Pengeluaran', 'Pemasukan', 'Transfer'].map(t => (
                    <button type="button" key={t} onClick={() => changeFormType(t)}
                      className={`py-2 rounded-lg transition ${formType === t ? 'bg-white dark:bg-gray-900 text-brand-600 shadow-sm' : 'text-gray-500'}`}>
                      {t}
                    </button>
                  ))}
                </div>

                <div className="space-y-1">
                  <label className="text-xs font-medium text-gray-500">Nominal (Rp)</label>
                  <div className="relative">
                    <span className="absolute left-3 top-3 text-sm font-bold text-gray-400">Rp</span>
                    <input type="text" inputMode="numeric" value={formAmount} onChange={handleAmountChange} placeholder="0" required
                      className="w-full pl-10 pr-4 py-2.5 rounded-xl bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 font-bold text-lg text-gray-900 dark:text-gray-100 focus:outline-none focus:ring-2 focus:ring-brand-500" />
                  </div>
                  {formAmount && (
                    <p className="text-[11px] text-brand-600 dark:text-brand-400 font-medium italic">
                      Terbilang: {terbilang(formAmount.replace(/\./g, ''))} Rupiah
                    </p>
                  )}
                </div>

                {accounts.length === 0 ? (
                  <div className="p-3 bg-amber-50 text-amber-700 text-xs rounded-xl">
                    ⚠️ Belum ada rekening. Tambahkan rekening dulu di menu Beranda.
                  </div>
                ) : (
                  <div className="grid grid-cols-1 gap-3">
                    <Field label={formType === 'Transfer' ? 'Dari Rekening' : 'Rekening / Sumber Dana'}>
                      <select value={formAccountId} onChange={e => setFormAccountId(e.target.value)} className={INPUT}>
                        {accounts.map(acc => <option key={acc.id} value={acc.id}>{acc.name} ({money(acc.balance)})</option>)}
                      </select>
                    </Field>
                    {formType === 'Transfer' && (
                      <Field label="Ke Rekening Tujuan">
                        <select value={formToAccountId} onChange={e => setFormToAccountId(e.target.value)} className={INPUT}>
                          {accounts.map(acc => <option key={acc.id} value={acc.id}>{acc.name} ({money(acc.balance)})</option>)}
                        </select>
                      </Field>
                    )}
                  </div>
                )}

                {formType !== 'Transfer' && (
                  <Field label="Kategori">
                    <select value={formCategory} onChange={e => setFormCategory(e.target.value)} className={INPUT}>
                      {(CATEGORIES[formType] || []).map(cat => <option key={cat} value={cat}>{cat}</option>)}
                    </select>
                  </Field>
                )}

                <Field label="Catatan">
                  <input type="text" value={formNote} onChange={e => setFormNote(e.target.value)} placeholder="Misal: Beli Kopi..." className={INPUT} />
                </Field>

                <button type="submit" className={SUBMIT}>Simpan Transaksi</button>
              </form>
            </Modal>
          )}

          {/* MODAL REKENING */}
          {isAccModalOpen && (
            <Modal title="Tambah Rekening / Aset" onClose={() => setIsAccModalOpen(false)}>
              <form onSubmit={handleSaveAccount} className="space-y-4">
                <Field label="Nama Rekening / Akun">
                  <input type="text" value={accName} onChange={e => setAccName(e.target.value)} placeholder="Misal: BCA, Dompet Cash, Bibit" required className={INPUT} />
                </Field>
                <Field label="Jenis Aset">
                  <select value={accType} onChange={e => setAccType(e.target.value)} className={INPUT}>
                    <option value="Bank">Bank</option>
                    <option value="Cash">Cash / Tunai</option>
                    <option value="Investasi">Investasi / Reksa Dana</option>
                    <option value="E-Wallet">E-Wallet</option>
                  </select>
                </Field>
                <Field label="Saldo Awal (Rp)">
                  <input type="text" inputMode="numeric" value={accBalance}
                    onChange={e => { const r = e.target.value.replace(/[^\d]/g, ''); setAccBalance(r ? formatIDR(r) : ''); }}
                    placeholder="0" className={INPUT} />
                </Field>
                <button type="submit" className={SUBMIT}>Simpan Rekening</button>
              </form>
            </Modal>
          )}

          {/* MODAL TARGET */}
          {isGoalModalOpen && (
            <Modal title="Buat Target Tabungan" onClose={() => setIsGoalModalOpen(false)}>
              <form onSubmit={handleSaveGoal} className="space-y-4">
                <Field label="Nama Target">
                  <input type="text" value={goalTitle} onChange={e => setGoalTitle(e.target.value)} placeholder="Misal: Beli Laptop Baru" required className={INPUT} />
                </Field>
                <Field label="Target Nominal (Rp)">
                  <input type="text" inputMode="numeric" value={goalTarget}
                    onChange={e => { const r = e.target.value.replace(/[^\d]/g, ''); setGoalTarget(r ? formatIDR(r) : ''); }}
                    placeholder="0" required className={INPUT} />
                </Field>
                <Field label="Terkumpul Saat Ini (Rp)">
                  <input type="text" inputMode="numeric" value={goalSaved}
                    onChange={e => { const r = e.target.value.replace(/[^\d]/g, ''); setGoalSaved(r ? formatIDR(r) : ''); }}
                    placeholder="0" className={INPUT} />
                </Field>
                <button type="submit" className={SUBMIT}>Simpan Target</button>
              </form>
            </Modal>
          )}

          {/* MODAL SETOR TARGET */}
          {selectedGoal && (
            <Modal title={`Setor ke: ${selectedGoal.title}`} onClose={() => setSelectedGoal(null)}>
              <form onSubmit={handleDepositToGoal} className="space-y-4">
                <Field label="Potong Saldo Dari Rekening">
                  <select value={goalDepositAccId} onChange={e => setGoalDepositAccId(e.target.value)} className={INPUT}>
                    {accounts.map(acc => <option key={acc.id} value={acc.id}>{acc.name} ({money(acc.balance)})</option>)}
                  </select>
                </Field>
                <Field label="Nominal Setoran (Rp)">
                  <input type="text" inputMode="numeric" value={goalDepositAmount}
                    onChange={e => { const r = e.target.value.replace(/[^\d]/g, ''); setGoalDepositAmount(r ? formatIDR(r) : ''); }}
                    placeholder="0" required className={INPUT} />
                </Field>
                <button type="submit" className={SUBMIT}>Konfirmasi Setoran</button>
              </form>
            </Modal>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
